<div class="bg"></div>
<header class="hdr">

</header>
<div class="prog-bar"><div class="prog-fill" id="pf"></div></div>
<main class="main"><div class="wrap" id="wrap"></div></main>

<script>
'use strict';
var cur=0, qIdx=0, scores=[], answersLog=[], pendingFollowup=null;
const WEBHOOK='https://script.google.com/macros/s/AKfycbxAxCDZ5laDTvU-dfxvdAmyE0JmWfGrDbMDNIf3S_OVK1o-rEM9Gbvz0qkTsXj-vC4k/exec';
const EXPEDIENTE_CONTEXT=`Jhomira Piedad Maldonado Cambisaca. Trabaja en el GAD Municipal de Santa Clara, Pastaza, dando apoyo tecnico y administrativo al Concejo Cantonal de Proteccion de Derechos. Salario $680/mes. Divorciada desde 2023, sin hijos. Padres viven en Ecuador. Sin familiares en Estados Unidos. IMPORTANTE: tuvo una negativa de visa 214(b) hace aproximadamente un mes. En esta nueva solicitud viaja como invitada de honor al Desfile Ecuatoriano 2026 en Nueva York, por invitacion oficial, en la delegacion institucional del GAD Municipal de Santa Clara junto al Alcalde (su superior jerarquico, no familiar). Viaje del 30 julio al 5 agosto 2026, mismo hospedaje institucional en Long Island City Queens. Contacto en NY: Comite Civico Ecuatoriano, Elmhurst Queens (organizacion, no persona). Cita consular AUN NO AGENDADA — pendiente pagar tasa MRV $185 y programar fecha en la Embajada de EEUU en Quito.`;

var QB=[
  {q:"Cual es el proposito de su viaje a los Estados Unidos?",
   tip:"Sea directa. Invitada de honor al Desfile Ecuatoriano 2026, viaja con la delegacion del municipio.",
   model:"Viajo como invitada de honor al Desfile Ecuatoriano 2026 en Nueva York, por invitacion oficial. Formo parte de la delegacion del Gobierno Municipal de Santa Clara, donde trabajo, junto al senor Alcalde.",
   kw:["invitada","honor","desfile","ecuatoriano","santa clara","alcalde","delegacion"]},
  {q:"Cuanto tiempo planea quedarse?",
   tip:"Respuesta corta y precisa. De las fechas exactas.",
   model:"Seis dias. Llego el 30 de julio y regreso el 5 de agosto de 2026.",
   kw:["seis","6","julio","agosto","30","5"]},
  {q:"Donde va a hospedarse?",
   tip:"Long Island City, Queens. Es el mismo domicilio de la delegacion institucional.",
   model:"En Long Island City, Queens, en el mismo domicilio donde se hospeda la delegacion institucional del municipio.",
   kw:["queens","long island","delegacion","institucional"]},
  {q:"Quien le paga el viaje?",
   tip:"Responda con seguridad segun lo acordado con el municipio (confirmar con Roberto antes de la entrevista).",
   model:"Los gastos de mi participacion en la delegacion estan cubiertos como parte de la invitacion institucional al Desfile Ecuatoriano.",
   kw:["cubiertos","delegacion","institucional","invitacion"]},
  {q:"Tiene familiares en los Estados Unidos?",
   tip:"No tiene ningun familiar en USA. Respuesta directa.",
   model:"No, no tengo familiares en los Estados Unidos.",
   kw:["no"]}
];

var QI=[
  {q:"Cual es su ocupacion actual?",
   tip:"Cargo tecnico en el GAD Municipal de Santa Clara.",
   model:"Trabajo en el Gobierno Autonomo Descentralizado del Canton Santa Clara, brindando apoyo tecnico y administrativo al Concejo Cantonal de Proteccion de Derechos.",
   kw:["gad","santa clara","concejo","proteccion","apoyo tecnico"]},
  {q:"Cuanto gana usted actualmente?",
   tip:"Sea precisa con la cifra exacta declarada en el DS-160.",
   model:"Seiscientos ochenta dolares mensuales. Es mi salario en el GAD Municipal de Santa Clara.",
   kw:["680","seiscientos","ochenta","salario"]},
  {q:"Cual es exactamente su relacion con la persona con la que viaja?",
   tip:"Aclarar sin rodeos: es su jefe institucional, no un familiar ni pareja.",
   model:"Es el Alcalde de Santa Clara, mi superior jerarquico en el municipio donde trabajo. Viajamos juntos porque formamos parte de la misma delegacion institucional invitada al Desfile Ecuatoriano 2026.",
   kw:["alcalde","jefe","superior","delegacion","institucional","municipio"]},
  {q:"Por que fue invitada como invitada de honor?",
   tip:"Por su cargo tecnico en el municipio, no a titulo personal.",
   model:"Por mi cargo en el GAD Municipal de Santa Clara y mi participacion en la gestion institucional del canton. La invitacion llego a traves del Comite Civico Ecuatoriano en coordinacion con el municipio.",
   kw:["gad","municipio","comite","invitacion","cargo"]},
  {q:"Con quien se va a reunir en Nueva York?",
   tip:"El Comite Civico Ecuatoriano en Elmhurst, Queens.",
   model:"Con el Comite Civico Ecuatoriano de Nueva York, en Elmhurst, Queens, como parte de las actividades oficiales del Desfile Ecuatoriano 2026.",
   kw:["comite","civico","elmhurst","queens","desfile"]}
];

var QD=[
  {q:"Usted ya solicito esta visa antes y fue negada. Por que cree que esta vez sera diferente?",
   tip:"No se disculpe ni suene nerviosa. El cambio real: invitacion oficial concreta + viaja en delegacion institucional con el Alcalde.",
   model:"Entiendo la negativa anterior. Desde entonces surgio esta invitacion oficial y concreta como invitada de honor al Desfile Ecuatoriano 2026, viajando en la delegacion institucional del Gobierno Municipal de Santa Clara junto al senor Alcalde. Es un proposito verificable que antes no existia.",
   kw:["negativa","invitacion","oficial","delegacion","alcalde","cambio"]},
  {q:"Hace cuanto fue negada su visa y por que solicita de nuevo tan pronto?",
   tip:"Sea honesta con la fecha, sin nerviosismo.",
   model:"Fue hace aproximadamente un mes. Solicito de nuevo porque surgio esta invitacion oficial concreta para el Desfile Ecuatoriano, algo que no existia en mi solicitud anterior.",
   kw:["un mes","negativa","invitacion","oficial"]},
  {q:"Con un salario de $680, como puede costear un viaje a Nueva York?",
   tip:"El viaje es corto y el hospedaje es institucional/compartido.",
   model:"El viaje es de solo seis dias y el hospedaje es compartido con la delegacion institucional, en el mismo domicilio que usa el municipio. Mis gastos personales son limitados y los tengo cubiertos.",
   kw:["seis","dias","hospedaje","delegacion","cubiertos"]},
  {q:"Cual es su relacion exactamente con el Alcalde de Santa Clara? Son familiares?",
   tip:"Aclarar sin rodeos: relacion estrictamente laboral e institucional.",
   model:"No somos familiares. El es el Alcalde de Santa Clara y mi superior jerarquico en el municipio donde trabajo. Viajamos en la misma delegacion oficial invitada al Desfile Ecuatoriano.",
   kw:["no","familiares","alcalde","jefe","delegacion","laboral"]},
  {q:"Que garantia tiene de que va a regresar a Ecuador?",
   tip:"Su puesto de trabajo y sus padres en Ecuador son su vinculo de retorno.",
   model:"Tengo mi puesto de trabajo en el GAD Municipal de Santa Clara, al que debo regresar. Mis padres viven en Ecuador y no tengo ningun vinculo que me retenga en Estados Unidos.",
   kw:["trabajo","gad","santa clara","padres","ecuador","regresar"]}
];

function norm(s){
  return s.toLowerCase()
    .replace(/[áàäâ]/g,'a').replace(/[éèëê]/g,'e')
    .replace(/[íìïî]/g,'i').replace(/[óòöô]/g,'o')
    .replace(/[úùüû]/g,'u').replace(/[ñ]/g,'n');
}

function goTo(n){cur=n;qIdx=0;pendingFollowup=null;render();}
function next(){goTo(Math.min(cur+1,7));}
function prev(){goTo(Math.max(cur-1,0));}

function localCheck(q,resp){
  var hits=q.kw.filter(function(k){return resp.indexOf(k)>=0;}).length;
  return hits>=Math.ceil(q.kw.length*0.4)&&resp.length>15;
}

async function check(){
  var pqs=cur===4?QB:cur===5?QI:QD;
  var wasFollowup=!!pendingFollowup;
  var q=pendingFollowup||pqs[qIdx];
  var respRaw=(document.getElementById('qa').value||'').trim();
  var resp=norm(respRaw);
  document.getElementById('btn-vrf').disabled=true;
  document.getElementById('btn-vrf').textContent='Consultando al oficial...';

  var evalId='ev'+Date.now()+Math.floor(Math.random()*1000);
  var historial=answersLog.slice(-3).map(function(a){
    return {pregunta:a.pregunta,respuesta:a.respuesta,evaluacion:a.evaluacion};
  });

  var iaResult=null;
  try{
    fetch(WEBHOOK,{
      method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({subtipo:'evaluarOficialConsular',evalId:evalId,pregunta:q.q,
        respuestaUsuario:respRaw,expedienteContext:EXPEDIENTE_CONTEXT,historial:historial})
    }).catch(function(){});

    for(var attempt=0;attempt<9;attempt++){
      await new Promise(function(r){setTimeout(r,1500);});
      try{
        var r=await fetch(WEBHOOK+'?action=getEvalOficial&evalId='+evalId);
        var d=await r.json();
        if(d.status==='ok' && d.evaluacion && d.evaluacion!=='error'){ iaResult=d; break; }
      }catch(e){}
    }
  }catch(e){}

  var ok, fbClass, fbEstado, fbMsg, repregunta='';
  if(iaResult){
    ok=iaResult.evaluacion==='bien';
    fbClass=iaResult.evaluacion;
    fbEstado=iaResult.evaluacion==='bien'?'Bien — el oficial esta conforme'
      :iaResult.evaluacion==='riesgo'?'Riesgo — respuesta debil'
      :'Mejorar — faltan detalles';
    fbMsg=iaResult.reaccionOficial+(iaResult.consejo?(' '+iaResult.consejo):'');
    repregunta=iaResult.repregunta||'';
  }else{
    ok=localCheck(q,resp);
    fbClass=ok?'bien':'mejorar';
    fbEstado=ok?'Bien — respuesta completa':'Mejorar — faltan elementos clave';
    fbMsg=ok?'Buena respuesta. Cubre los puntos esenciales.':'Revisa la respuesta modelo. Asegurate de incluir los detalles especificos.';
  }

  scores.push(ok);
  answersLog.push({pregunta:q.q, respuesta:respRaw, evaluacion:fbClass});

  if(!wasFollowup && iaResult && iaResult.evaluacion!=='bien' && iaResult.repregunta){
    pendingFollowup={q:iaResult.repregunta, tip:'', model:q.model, kw:q.kw};
  }else{
    pendingFollowup=null;
  }

  var fb=document.getElementById('fb');
  fb.className='fb '+fbClass;
  document.getElementById('fb-estado').textContent=fbEstado;
  document.getElementById('fb-msg').textContent=fbMsg;
  document.getElementById('fb-model').textContent=q.model;
  var repregEl=document.getElementById('fb-repregunta');
  if(repregEl){
    if(pendingFollowup){ repregEl.textContent='El oficial insiste: «'+pendingFollowup.q+'»'; repregEl.style.display='block'; }
    else{ repregEl.style.display='none'; }
  }
  fb.style.display='block';
  document.getElementById('btn-nxt').classList.remove('hidden');
  document.getElementById('qa').disabled=true;
  document.getElementById('btn-vrf').textContent='Verificado';
}

function setHdr(){

function mkDots(pqs){
  return pqs.map(function(_,i){

function render(){
  setHdr();
  var w=document.getElementById('wrap');
  if(cur===0){renderBienvenida();}
  else if(cur===1){renderEvalua();}
  else if(cur===2){renderFortalezas();}
  else if(cur===3){renderDS160();}
  else if(cur===4){renderPractica(QB,'basico','n1','&#9679; Nivel basico');}
  else if(cur===5){renderPractica(QI,'intermedio','n2','&#9679; Nivel intermedio');}
  else if(cur===6){renderPractica(QD,'dificil','n3','&#9679; Nivel dificil');}
  else if(cur===7){renderProtocolo();}
}
