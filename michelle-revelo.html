<!DOCTYPE html>
<html lang="es">

<title>Preparación Entrevista — Michelle Revelo Suárez</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#060E1F;--navy2:#0d1a30;--navy3:#162840;
  --gold:#F5C842;--gold2:#C8861A;--gold-dim:rgba(245,200,66,.1);
  --green:#10B981;--red:#EF4444;--amber:#F59E0B;--blue:#3B82F6;
  --white:#fff;--muted:rgba(255,255,255,.5);--border:rgba(255,255,255,.08);
  --card:rgba(255,255,255,.04);--sans:'Space Grotesk',sans-serif;
  --serif:'Playfair Display',serif;--ease:cubic-bezier(.22,.68,0,1.2);--r:14px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--navy);color:var(--white);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 50% at 15% 0%,rgba(245,200,66,.06),transparent 55%),
             radial-gradient(ellipse 60% 40% at 85% 100%,rgba(59,130,246,.05),transparent 60%),var(--navy)}
.hdr{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(6,14,31,.95);
  backdrop-filter:blur(20px);border-bottom:1px solid var(--border);
  padding:0 20px;height:56px;display:flex;align-items:center;gap:12px}
.logo{font-family:var(--serif);font-size:.875rem;font-weight:700}
.logo em{color:var(--gold);font-style:italic}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.hdr-prog{font-size:.7rem;color:var(--muted)}
.hdr-prog strong{color:var(--gold)}
.prog-bar{position:fixed;top:56px;left:0;right:0;z-index:99;height:3px;background:rgba(255,255,255,.06)}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--blue));transition:width .5s ease;width:0%}
.main{position:relative;z-index:1;padding:72px 16px 48px;min-height:100vh}
.wrap{max-width:640px;margin:0 auto}
.screen{opacity:1;animation:fadeUp .3s ease-out}
.hidden{display:none!important}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.fam-badge{display:inline-flex;align-items:center;gap:8px;font-size:.65rem;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--gold);
  background:var(--gold-dim);border:1px solid rgba(245,200,66,.2);
  padding:5px 14px;border-radius:99px;margin-bottom:20px}
.fam-badge span{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.welcome-title{font-family:var(--serif);font-size:clamp(2rem,6vw,2.8rem);line-height:1.15;margin-bottom:14px}
.welcome-title em{color:var(--gold);font-style:italic}
.welcome-sub{font-size:.9rem;color:var(--muted);line-height:1.7;margin-bottom:24px}

.trip-box{background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.2);
  border-radius:var(--r);padding:16px;margin-bottom:20px}
.trip-ttl{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--blue);margin-bottom:10px}
.trip-row{display:flex;justify-content:space-between;padding:5px 0;
  border-bottom:1px solid rgba(255,255,255,.05);font-size:.8rem}
.trip-row:last-child{border-bottom:none}
.trip-l{color:var(--muted)}.trip-v{font-weight:600;text-align:right}

.btn-primary{width:100%;padding:15px;background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:var(--navy);border:none;border-radius:50px;font-family:var(--sans);
  font-size:.9375rem;font-weight:800;cursor:pointer;transition:all .25s var(--ease)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 40px rgba(245,200,66,.3)}

@media(max-width:520px){
  .welcome-title{font-size:clamp(1.6rem,7vw,2.4rem)}
  .trip-row{font-size:.75rem;flex-wrap:wrap;gap:2px}
}

.mod-tag{display:inline-block;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;padding:4px 12px;border-radius:99px;margin-bottom:12px}
.mod-tag.practice{background:rgba(16,185,129,.15);color:var(--green);border:1px solid rgba(16,185,129,.2)}
.nivel-badge{display:inline-flex;align-items:center;gap:6px;font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:99px;margin-bottom:14px}
.n1{background:rgba(16,185,129,.12);color:var(--green);border:1px solid rgba(16,185,129,.25)}
.n2{background:rgba(245,158,11,.12);color:var(--amber);border:1px solid rgba(245,158,11,.25)}
.n3{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25)}
.q-counter{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.qc-label{font-size:.75rem;color:var(--muted)}
.qc-dots{display:flex;gap:5px}
.qc-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.15)}
.qc-dot.done{background:var(--green)}
.qc-dot.cur{background:var(--gold)}
.q-text{font-family:var(--serif);font-size:1.1rem;line-height:1.4;margin-bottom:6px}
.q-input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;padding:13px;color:var(--white);font-family:var(--sans);font-size:.875rem;resize:vertical;min-height:80px}
.q-input:focus{outline:none;border-color:rgba(245,200,66,.4)}
.q-input::placeholder{color:rgba(255,255,255,.2)}
.fb{display:none;margin-top:12px;border-radius:var(--r);padding:14px}
.fb.bien{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.25)}
.fb.mejorar{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25)}
.fb.riesgo{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25)}
.fb-estado{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.fb.bien .fb-estado{color:var(--green)}
.fb.mejorar .fb-estado{color:var(--amber)}
.fb.riesgo .fb-estado{color:var(--red)}
.fb-msg{font-size:.8125rem;color:rgba(255,255,255,.8);line-height:1.6}
.fb-repregunta{display:none;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);font-size:.8rem;color:rgba(245,200,66,.85);font-style:italic;line-height:1.6}
.fb-model{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08)}
.fb-model-label{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.4);margin-bottom:5px}
.fb-model-text{font-size:.8rem;color:rgba(255,255,255,.6);line-height:1.6;font-style:italic}
.btn-p{width:100%;padding:15px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy);border:none;border-radius:50px;font-family:var(--sans);font-size:.9375rem;font-weight:800;cursor:pointer;margin-bottom:10px}
.btn-s{width:100%;padding:13px;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:50px;font-family:var(--sans);font-size:.875rem;cursor:pointer;margin-bottom:10px}
.btn-vrf{width:100%;margin-top:10px;padding:13px;background:var(--navy3);color:var(--white);border:1px solid var(--border);border-radius:50px;font-family:var(--sans);font-size:.875rem;font-weight:600;cursor:pointer}
.btn-nxt{width:100%;margin-top:10px;padding:14px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy);border:none;border-radius:50px;font-family:var(--sans);font-size:.875rem;font-weight:800;cursor:pointer}

.study-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px}
.study-q{font-family:var(--serif);font-size:.95rem;font-weight:700;margin-bottom:6px;line-height:1.4}
.study-tip{font-size:.72rem;color:var(--muted);font-style:italic;margin-bottom:8px;line-height:1.5}
.study-a-label{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);margin-bottom:4px}
.study-a{font-size:.82rem;color:rgba(255,255,255,.85);line-height:1.6}
.study-nivel-hdr{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin:16px 0 8px}
</style>
</head>

<script>
'use strict';
const PAGE='michelle-revelo.html';

const persona={
  nombre:'Michelle Monserrath Revelo Suárez',
  cita:'POR AGENDAR — DS-160 recién enviado (4 ago 2026)',
  ubicacion:'Consulado de Estados Unidos, Quito (por confirmar con la cita)',
  ds160:'AA00FPK3AJ', pasaporte:'B1542895',
  viaje:{
    destino:'Nueva York, NY',
    fechas:'20-28 septiembre 2026',
    hotel:'891 Amsterdam Avenue, Upper West Side, NY 10025',
    propósito:'Semana del Clima de Nueva York — delegada oficial de la Alcaldesa (B1/B2)'
  }
};

/* Fuente: DS-160 + carta oficial ICLEI (dirigida a la Alcaldesa Shirma Cortes,
   Michelle viaja como delegada designada, no invitada directa). No inventar datos. */
const expedienteContext=`Michelle Monserrath Revelo Suarez, nacida 18 may 1996 en Quito. Soltera. Jefa de Uso y Ocupacion de Suelo en el GAD Municipal de Fco. de Orellana, ingreso $1,612/mes. Funciones: analisis y proceso de solicitudes de permisos de funcionamiento, verificacion de normativa municipal de uso de suelo, elaboracion de informes tecnicos. Empleos previos: GAD Municipal Canton Penipe - Coordinadora de Avaluos y Catastros (jul 2023-mar 2024); Ministerio de Ambiente y Energia, Macas - Analista de Administracion y Control Forestal (mar-may 2023). Estudios: Maestria en Planificacion y Prospectiva Multisectorial, Instituto de Altos Estudios Nacionales (IAEN), Quito (2021-2023); Ingenieria Geografica y Planificacion Territorial, PUCE Quito (2014-2019). Idiomas: espanol e ingles. Viajes previos: Colombia (ultimos 5 anos). PRIMER VIAJE A ESTADOS UNIDOS. Sin rechazos previos. Sin familiares en USA. Padres Jose Revelo y Maria Suarez, ambos en Ecuador. CONTEXTO DEL VIAJE: la Alcaldesa Shirma Cortes Sanmiguel recibio una carta oficial de invitacion de ICLEI (red global de gobiernos locales por sostenibilidad, mas de 2,500 miembros en 125 paises) para participar en la delegacion de gobiernos locales de la Semana del Clima de Nueva York (New York Climate Week), del 20 al 27 de septiembre 2026, en paralelo a la Asamblea General de la ONU. Michelle NO tiene invitacion propia de ICLEI — fue designada oficialmente por la Alcaldesa como DELEGADA para acompanarla y apoyarla en representacion del GAD Francisco de Orellana en el evento, dado su perfil tecnico en ordenamiento territorial y uso de suelo, relevante a temas de sostenibilidad urbana. Pendiente: memo/oficio formal de designacion del GAD (aun no emitido). Hospedaje: 891 Amsterdam Avenue, Upper West Side, NY 10025. DS-160: AA00FPK3AJ, pasaporte B1542895 (nuevo, emitido jul 2026). Cita consular: POR AGENDAR, DS-160 firmado 4 agosto 2026.`;

const QB=[
  {q:"¿Cuál es el propósito de su viaje a Estados Unidos?",
   tip:"Fue designada delegada oficial por la Alcaldesa para acompañarla a la Semana del Clima de Nueva York.",
   model:"Viajo a Nueva York como delegada oficial designada por la Alcaldesa de mi municipio, para acompañarla y apoyarla en la Semana del Clima de Nueva York, del 20 al 28 de septiembre de 2026.",
   kw:["delegada","designada","alcaldesa","semana del clima","nueva york"]},
  {q:"¿A qué se dedica usted?",
   tip:"Jefa de Uso y Ocupación de Suelo en el GAD de Fco. de Orellana.",
   model:"Soy Jefa de Uso y Ocupación de Suelo en el Gobierno Autónomo Descentralizado Municipal de Francisco de Orellana. Analizo y proceso solicitudes de permisos de funcionamiento y elaboro informes técnicos.",
   kw:["jefa","uso","ocupacion","suelo","gad","orellana"]},
  {q:"¿Con quién viaja?",
   tip:"Con la Alcaldesa Shirma Cortés, quien fue invitada oficialmente por ICLEI.",
   model:"Viajo con la Alcaldesa Shirma Cortés, quien fue invitada oficialmente por ICLEI, una red internacional de gobiernos locales, a la Semana del Clima de Nueva York.",
   kw:["alcaldesa","shirma","cortes","iclei","invitada"]},
  {q:"¿Tiene usted una invitación propia del evento?",
   tip:"No directamente — la invitación es a la Alcaldesa; ella la designó delegada oficial del GAD.",
   model:"La invitación oficial de ICLEI está dirigida a la Alcaldesa. Yo fui designada por ella como delegada oficial para acompañarla en representación del municipio.",
   kw:["invitacion","alcaldesa","designada","delegada","representacion"]},
  {q:"¿Dónde se van a hospedar?",
   tip:"891 Amsterdam Avenue, Upper West Side, Nueva York.",
   model:"En el 891 de Amsterdam Avenue, en el Upper West Side de Nueva York. Ya tenemos la dirección confirmada.",
   kw:["amsterdam","upper west side","nueva york","891"]}
];
const QI=[
  {q:"¿Cuánto gana usted?",
   tip:"$1,612 mensuales exactos.",
   model:"Mil seiscientos doce dólares mensuales, como salario en el GAD Municipal de Francisco de Orellana.",
   kw:["1612","mil seiscientos","doce","salario"]},
  {q:"¿Por qué la designaron a usted como delegada y no a otra persona?",
   tip:"Su perfil técnico en uso de suelo y ordenamiento territorial es relevante al tema del evento (sostenibilidad urbana).",
   model:"Me designaron por mi perfil técnico en uso y ocupación de suelo y ordenamiento territorial, un área directamente relevante a los temas de sostenibilidad urbana que se tratarán en el evento.",
   kw:["perfil tecnico","uso","suelo","ordenamiento","sostenibilidad"]},
  {q:"¿Cuál es su formación académica?",
   tip:"Maestría en el IAEN e Ingeniería Geográfica en la PUCE Quito.",
   model:"Tengo una Maestría en Planificación y Prospectiva Multisectorial del Instituto de Altos Estudios Nacionales, y soy Ingeniera Geográfica y en Planificación Territorial de la PUCE Quito.",
   kw:["maestria","iaen","ingeniera","geografica","puce"]},
  {q:"¿Ha viajado antes fuera de Ecuador?",
   tip:"Sí, a Colombia en los últimos 5 años.",
   model:"Sí, he viajado a Colombia en los últimos cinco años, y regresé a Ecuador sin ningún inconveniente.",
   kw:["colombia","regrese","ecuador"]},
  {q:"¿Cuándo regresa a Ecuador y por qué?",
   tip:"28 de septiembre, junto con la Alcaldesa; debe retomar sus funciones en el GAD.",
   model:"Regreso el 28 de septiembre de 2026, junto con la Alcaldesa. Debo retomar mis funciones en el área de Uso y Ocupación de Suelo del municipio.",
   kw:["28","septiembre","2026","funciones","municipio"]}
];
const QD=[
  {q:"¿Tiene un documento formal que respalde su designación como delegada?",
   tip:"Si el GAD emite un memo/oficio de designación, mencionarlo y llevarlo impreso; si no, explicar que la designación es verbal/institucional de la Alcaldesa.",
   model:"La Alcaldesa me designó como delegada oficial para este viaje en representación del municipio. Estamos gestionando el oficio formal de designación del GAD para tenerlo también por escrito.",
   kw:["designacion","alcaldesa","oficial","gad","oficio"]},
  {q:"¿Por qué debería creer que usted, siendo funcionaria y no la máxima autoridad, va a regresar a Ecuador?",
   tip:"Empleo público estable, formación académica en Ecuador, viaje corto institucional, sin familiares en USA.",
   model:"Tengo un empleo público estable en el GAD de Francisco de Orellana, toda mi carrera profesional y mi familia están en Ecuador, y este es un viaje institucional corto de ocho días. No tengo familiares en Estados Unidos.",
   kw:["empleo","estable","familia","ecuador","ocho","dias","sin familiares"]},
  {q:"¿Qué relación tiene su cargo con el tema del evento en Nueva York?",
   tip:"Uso de suelo y ordenamiento territorial están directamente ligados a sostenibilidad urbana, tema central del evento.",
   model:"Mi cargo de Jefa de Uso y Ocupación de Suelo está directamente relacionado con la planificación urbana sostenible, que es el eje central de la Semana del Clima de Nueva York.",
   kw:["uso","suelo","planificacion","sostenible","clima"]},
  {q:"¿Cómo se financia este viaje?",
   tip:"Viaje institucional en representación del GAD; sus ingresos cubren gastos personales.",
   model:"Es un viaje institucional en representación del municipio, y mis ingresos, de mil seiscientos doce dólares mensuales, cubren mis gastos personales de viaje.",
   kw:["institucional","ingresos","1612","gastos"]},
  {q:"¿Qué pasa con sus funciones en el municipio mientras usted no está?",
   tip:"Viaje corto de 8 días, planificado y coordinado con el municipio.",
   model:"Es un viaje corto de ocho días, planificado y coordinado con mi jefatura en el municipio, para que mis funciones no se vean afectadas.",
   kw:["ocho","dias","planificado","coordinado","municipio"]}
];

function norm(s){return s.toLowerCase().replace(/[áàäâ]/g,'a').replace(/[éèëê]/g,'e').replace(/[íìïî]/g,'i').replace(/[óòöô]/g,'o').replace(/[úùüû]/g,'u').replace(/[ñ]/g,'n');}

let nivelIdx=0, qIdx=0, scores=[], answersLog=[], pendingFollowup=null;
const WEBHOOK='https://script.google.com/macros/s/AKfycbxAxCDZ5laDTvU-dfxvdAmyE0JmWfGrDbMDNIf3S_OVK1o-rEM9Gbvz0qkTsXj-vC4k/exec';
const NIVELES=[
  {qs:QB,nivel:'basico',cls:'n1',titulo:'● Nivel básico'},
  {qs:QI,nivel:'intermedio',cls:'n2',titulo:'● Nivel intermedio'},
  {qs:QD,nivel:'dificil',cls:'n3',titulo:'● Nivel difícil'}
];

function mkDots(pqs){return pqs.map(function(_,i){return '<div class="qc-dot'+(i<qIdx?' done':i===qIdx?' cur':'')+'"></div>';}).join('');}
function localCheck(q,resp){const hits=q.kw.filter(function(k){return resp.indexOf(k)>=0;}).length;return hits>=Math.ceil(q.kw.length*0.4)&&resp.length>15;}

async function check(){
  const pqs=NIVELES[nivelIdx].qs;
  const wasFollowup=!!pendingFollowup;
  const q=pendingFollowup||pqs[qIdx];
  const respRaw=(document.getElementById('qa').value||'').trim();
  const resp=norm(respRaw);
  document.getElementById('btn-vrf').disabled=true;
  document.getElementById('btn-vrf').textContent='Consultando al oficial...';
  const evalId='ev'+Date.now()+Math.floor(Math.random()*1000);
  const historial=answersLog.slice(-3).map(function(a){return {pregunta:a.pregunta,respuesta:a.respuesta,evaluacion:a.evaluacion};});
  let iaResult=null;
  try{
    fetch(WEBHOOK,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({subtipo:'evaluarOficialConsular',evalId:evalId,pregunta:q.q,respuestaUsuario:respRaw,expedienteContext:expedienteContext,historial:historial})}).catch(function(){});
    for(let attempt=0;attempt<9;attempt++){
      await new Promise(function(r){setTimeout(r,1500);});
      try{
        const r=await fetch(WEBHOOK+'?action=getEvalOficial&evalId='+evalId);
        const d=await r.json();
        if(d.status==='ok' && d.evaluacion && d.evaluacion!=='error'){ iaResult=d; break; }
      }catch(e){}
    }
  }catch(e){}
  let ok, fbClass, fbEstado, fbMsg;
  if(iaResult){
    ok=iaResult.evaluacion==='bien';
    fbClass=iaResult.evaluacion;
    fbEstado=iaResult.evaluacion==='bien'?'Bien — el oficial está conforme':iaResult.evaluacion==='riesgo'?'Riesgo — respuesta débil':'Mejorar — faltan detalles';
    fbMsg=iaResult.reaccionOficial+(iaResult.consejo?(' '+iaResult.consejo):'');
  }else{
    ok=localCheck(q,resp);
    fbClass=ok?'bien':'mejorar';
    fbEstado=ok?'Bien — respuesta completa':'Mejorar — faltan elementos clave';
    fbMsg=ok?'Buena respuesta. Cubre los puntos esenciales que el oficial consular espera escuchar.':'Revisa la respuesta modelo. Asegúrate de incluir los detalles específicos de tu expediente.';
  }
  scores.push(ok);
  answersLog.push({pregunta:q.q, respuesta:respRaw, evaluacion:fbClass});
  if(!wasFollowup && iaResult && iaResult.evaluacion!=='bien' && iaResult.repregunta){
    pendingFollowup={q:iaResult.repregunta, model:q.model, kw:q.kw};
  }else{ pendingFollowup=null; }
  const fb=document.getElementById('fb');
  fb.className='fb '+fbClass;
  document.getElementById('fb-estado').textContent=fbEstado;
  document.getElementById('fb-msg').textContent=fbMsg;
  document.getElementById('fb-model').textContent=q.model;
  const repregEl=document.getElementById('fb-repregunta');
  if(repregEl){
    if(pendingFollowup){ repregEl.textContent='El oficial insiste: «'+pendingFollowup.q+'»'; repregEl.style.display='block'; }
    else{ repregEl.style.display='none'; }
  }
  fb.style.display='block';
  document.getElementById('btn-nxt').classList.remove('hidden');
  document.getElementById('qa').disabled=true;
  document.getElementById('btn-vrf').textContent='Verificado';
}

function nextQ(){ if(!pendingFollowup) qIdx++; renderPractica(); }
function siguienteNivel(){ nivelIdx++; qIdx=0; pendingFollowup=null; renderPractica(); }
function repetirNivel(){ qIdx=0; pendingFollowup=null; renderPractica(); }

function renderPractica(){
  const nv=NIVELES[nivelIdx];
  document.getElementById('hdrProg').innerHTML='Practicando · <strong>Michelle</strong>';
  document.getElementById('prog-fill').style.width=Math.round(((nivelIdx+qIdx/nv.qs.length)/NIVELES.length)*100)+'%';
  window.scrollTo(0,0);
  if(qIdx>=nv.qs.length){
    const t=nv.qs.length; let b=0;
    for(let i=scores.length-t;i<scores.length;i++){ if(scores[i]) b++; }
    const hayMas=nivelIdx+1<NIVELES.length;
    document.getElementById('wrap').innerHTML='<div class="screen" style="text-align:center">'
      +'<div style="font-size:2rem;margin-bottom:12px">'+(b===t?'🎉':'💪')+'</div>'
      +'<div class="welcome-title" style="font-size:1.6rem">Nivel '+nv.nivel+'<br><em>completado</em></div>'
      +'<p class="welcome-sub">'+b+' de '+t+' respuestas completas.</p>'
      +(hayMas?'<button class="btn-p" onclick="siguienteNivel()">Siguiente nivel →</button>':'<button class="btn-p" onclick="location.href=\''+PAGE+'\'">Volver al inicio →</button>')
      +'<button class="btn-s" onclick="repetirNivel()">Repetir este nivel</button></div>';
    return;
  }
  const q=pendingFollowup||nv.qs[qIdx];
  document.getElementById('wrap').innerHTML='<div class="screen">'
    +'<span class="mod-tag practice">Practicando</span><br>'
    +'<span class="nivel-badge '+nv.cls+'">'+nv.titulo+' — '+(qIdx+1)+' de '+nv.qs.length+'</span>'
    +(pendingFollowup?'<div style="font-size:.7rem;color:var(--red);font-weight:700;margin-bottom:8px">⚠ El oficial no quedó conforme — insiste en el mismo punto</div>':'')
    +'<div class="q-counter"><span class="qc-label">Preguntas</span><div class="qc-dots">'+mkDots(nv.qs)+'</div></div>'
    +'<p class="q-text">« '+q.q+' »</p>'
    +'<textarea class="q-input" id="qa" placeholder="Escribe tu respuesta aquí..."></textarea>'
    +'<button class="btn-vrf" id="btn-vrf" onclick="check()">Verificar →</button>'
    +'<div class="fb" id="fb" style="display:none">'
      +'<div class="fb-estado" id="fb-estado"></div><div class="fb-msg" id="fb-msg"></div>'
      +'<div class="fb-repregunta" id="fb-repregunta"></div>'
      +'<div class="fb-model"><div class="fb-model-label">Respuesta modelo</div><div class="fb-model-text" id="fb-model"></div></div>'
    +'</div>'
    +'<button class="btn-nxt hidden" id="btn-nxt" onclick="nextQ()">'+(qIdx+1<nv.qs.length?'Siguiente pregunta →':'Ver resumen →')+'</button>'
    +'<button class="btn-s" style="margin-top:20px" onclick="renderEstudio()">← Ver respuestas de nuevo</button>'
    +'</div>';
}

function renderEstudio(){
  document.getElementById('hdrProg').innerHTML='Estudiando · <strong>Michelle</strong>';
  document.getElementById('prog-fill').style.width='0%';
  window.scrollTo(0,0);
  let html='<div class="screen">'
    +'<span class="mod-tag" style="background:rgba(59,130,246,.15);color:var(--blue);border:1px solid rgba(59,130,246,.2)">Paso 1 · Estudiar</span>'
    +'<h1 class="welcome-title" style="font-size:1.8rem">Tus <em>respuestas</em></h1>'
    +'<p class="welcome-sub">Lee cada pregunta y su respuesta modelo con calma, todas basadas en tu DS-160 y el contexto de designación como delegada oficial. Cuando ya te las sepas de memoria, pasa a practicar sin ver la respuesta.</p>';
  NIVELES.forEach(function(nv){
    const color=nv.cls==='n1'?'var(--green)':nv.cls==='n2'?'var(--amber)':'var(--red)';
    html+='<div class="study-nivel-hdr" style="color:'+color+'">'+nv.titulo.replace('● ','')+'</div>';
    nv.qs.forEach(function(q){
      html+='<div class="study-card"><div class="study-q">« '+q.q+' »</div><div class="study-tip">💡 '+q.tip+'</div><div class="study-a-label">Respuesta modelo</div><div class="study-a">'+q.model+'</div></div>';
    });
  });
  html+='<button class="btn-p" onclick="empezarPractica()">Ya me las sé — empezar práctica →</button></div>';
  document.getElementById('wrap').innerHTML=html;
}

function empezarPractica(){ nivelIdx=0; qIdx=0; scores=[]; pendingFollowup=null; renderPractica(); }
