<!DOCTYPE html>
<html lang="es">
<head>
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
<script>if(location.protocol!=="https:")location.replace("https:"+location.href.substring(location.protocol.length));</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preparación Entrevista — Familia Rodríguez Masache</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#060E1F;--navy2:#0d1a30;--navy3:#162840;
  --gold:#F5C842;--gold2:#C8861A;--gold-dim:rgba(245,200,66,.1);
  --green:#10B981;--red:#EF4444;--amber:#F59E0B;--blue:#3B82F6;
  --white:#fff;--muted:rgba(255,255,255,.5);--border:rgba(255,255,255,.08);
  --card:rgba(255,255,255,.04);--sans:'Space Grotesk',sans-serif;
  --serif:'Playfair Display',serif;--ease:cubic-bezier(.22,.68,0,1.2);--r:14px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--navy);color:var(--white);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 50% at 15% 0%,rgba(245,200,66,.06),transparent 55%),
             radial-gradient(ellipse 60% 40% at 85% 100%,rgba(59,130,246,.05),transparent 60%),var(--navy)}
.hdr{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(6,14,31,.95);
  backdrop-filter:blur(20px);border-bottom:1px solid var(--border);
  padding:0 20px;height:56px;display:flex;align-items:center;gap:12px}
.logo{font-family:var(--serif);font-size:.875rem;font-weight:700}
.logo em{color:var(--gold);font-style:italic}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.hdr-prog{font-size:.7rem;color:var(--muted)}
.hdr-prog strong{color:var(--gold)}
.prog-bar{position:fixed;top:56px;left:0;right:0;z-index:99;height:3px;background:rgba(255,255,255,.06)}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--blue));transition:width .5s ease;width:0%}
.main{position:relative;z-index:1;padding:72px 16px 48px;min-height:100vh}
.wrap{max-width:640px;margin:0 auto}
.screen{opacity:1;animation:fadeUp .3s ease-out}
.hidden{display:none!important}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* WELCOME */
.fam-badge{display:inline-flex;align-items:center;gap:8px;font-size:.65rem;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--gold);
  background:var(--gold-dim);border:1px solid rgba(245,200,66,.2);
  padding:5px 14px;border-radius:99px;margin-bottom:20px}
.fam-badge span{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.welcome-title{font-family:var(--serif);font-size:clamp(2rem,6vw,2.8rem);line-height:1.15;margin-bottom:14px}
.welcome-title em{color:var(--gold);font-style:italic}
.welcome-sub{font-size:.9rem;color:var(--muted);line-height:1.7;margin-bottom:24px}
.fam-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
@media(max-width:520px){.fam-grid{grid-template-columns:1fr}}
.fam-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:16px;cursor:pointer;transition:all .25s var(--ease)}
.fam-card:hover,.fam-card:active{border-color:rgba(245,200,66,.4);transform:translateY(-3px);
  box-shadow:0 8px 30px rgba(0,0,0,.3);background:rgba(245,200,66,.05)}
.fam-card.primary{border-color:rgba(245,200,66,.25);background:rgba(245,200,66,.05)}
.fam-role{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);margin-bottom:5px}
.fam-name{font-family:var(--serif);font-size:1rem;font-weight:700;margin-bottom:3px}
.fam-info{font-size:.75rem;color:var(--muted);line-height:1.4;margin-bottom:8px}
.fam-go{font-size:.65rem;font-weight:700;color:var(--gold);letter-spacing:.05em}
.tag{display:inline-block;font-size:.6rem;font-weight:700;padding:2px 8px;border-radius:99px;margin-bottom:4px}
.tag-g{background:rgba(16,185,129,.15);color:var(--green);border:1px solid rgba(16,185,129,.2)}
.tag-b{background:rgba(59,130,246,.15);color:var(--blue);border:1px solid rgba(59,130,246,.2)}

.mode-box{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.mode-btn{display:flex;align-items:center;gap:14px;background:var(--card);
  border:1px solid var(--border);border-radius:var(--r);padding:14px;
  cursor:pointer;transition:all .2s;text-align:left;color:var(--white)}
.mode-btn:hover{border-color:rgba(245,200,66,.3);background:rgba(245,200,66,.04)}
.mode-icon{font-size:1.4rem;flex-shrink:0}
.mode-title{font-weight:700;font-size:.875rem;margin-bottom:2px}
.mode-sub{font-size:.72rem;color:var(--muted)}
.trip-box{background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.2);
  border-radius:var(--r);padding:16px;margin-bottom:20px}
.trip-ttl{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--blue);margin-bottom:10px}
.trip-row{display:flex;justify-content:space-between;padding:5px 0;
  border-bottom:1px solid rgba(255,255,255,.05);font-size:.8rem}
.trip-row:last-child{border-bottom:none}
.trip-l{color:var(--muted)}.trip-v{font-weight:600}

/* DS-160 REVIEW */
.ds-header{background:linear-gradient(135deg,var(--navy2),var(--navy3));
  border:1px solid rgba(245,200,66,.2);border-radius:var(--r);padding:18px;margin-bottom:14px}
.ds-name{font-family:var(--serif);font-size:1.3rem;font-weight:700;margin-bottom:4px}
.ds-sub{font-size:.8rem;color:rgba(245,200,66,.8);font-weight:600}
.ds-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
@media(max-width:520px){.ds-grid{grid-template-columns:1fr}}
.ds-field{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px}
.ds-label{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.ds-value{font-size:.875rem;font-weight:600;color:var(--white);line-height:1.4}
.ds-field.highlight{border-color:rgba(245,200,66,.3);background:rgba(245,200,66,.05)}
.ds-field.ok{border-color:rgba(16,185,129,.25);background:rgba(16,185,129,.05)}
.ds-field.warn{border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.05)}
.ds-note{background:rgba(59,130,246,.06);border-left:3px solid var(--blue);
  border-radius:0 8px 8px 0;padding:12px 14px;margin-bottom:14px;font-size:.825rem;
  color:rgba(255,255,255,.75);line-height:1.6}

/* MÓDULOS */
.mod-tag{display:inline-block;font-size:.6rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.12em;padding:4px 12px;border-radius:99px;margin-bottom:12px}
.mod-tag.learn{background:rgba(59,130,246,.15);color:var(--blue);border:1px solid rgba(59,130,246,.2)}
.mod-tag.practice{background:rgba(16,185,129,.15);color:var(--green);border:1px solid rgba(16,185,129,.2)}
.mod-tag.tip{background:rgba(245,200,66,.12);color:var(--gold);border:1px solid rgba(245,200,66,.2)}
.mod-tag.warn{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.mod-tag.review{background:rgba(124,58,237,.15);color:#A78BFA;border:1px solid rgba(124,58,237,.2)}
.mod-title{font-family:var(--serif);font-size:clamp(1.5rem,4vw,2rem);line-height:1.2;margin-bottom:8px}
.mod-title em{color:var(--gold);font-style:italic}
.mod-sub{font-size:.875rem;color:var(--muted);line-height:1.6;margin-bottom:20px}
.info-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:16px;margin-bottom:10px}
.ic-num{font-family:var(--serif);font-size:1.8rem;font-weight:700;color:rgba(245,200,66,.2);line-height:1;margin-bottom:7px}
.ic-title{font-weight:700;font-size:.9375rem;margin-bottom:5px}
.ic-body{font-size:.8125rem;color:rgba(255,255,255,.6);line-height:1.65}
.strength-card{background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.2);
  border-radius:var(--r);padding:14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}
.sc-icon{font-size:1.2rem;flex-shrink:0}
.sc-title{font-weight:700;font-size:.875rem;margin-bottom:3px}
.sc-body{font-size:.8rem;color:rgba(255,255,255,.55);line-height:1.55}
.resp-box{background:rgba(59,130,246,.06);border-left:3px solid var(--blue);
  border-radius:0 var(--r) var(--r) 0;padding:14px;margin:10px 0}
.resp-label{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--blue);margin-bottom:7px}
.resp-text{font-size:.875rem;color:rgba(255,255,255,.8);line-height:1.7;font-style:italic}

/* NIVEL BADGE */
.nivel-badge{display:inline-flex;align-items:center;gap:6px;font-size:.65rem;
  font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 12px;border-radius:99px;margin-bottom:14px}
.nivel-1{background:rgba(16,185,129,.12);color:var(--green);border:1px solid rgba(16,185,129,.25)}
.nivel-2{background:rgba(245,158,11,.12);color:var(--amber);border:1px solid rgba(245,158,11,.25)}
.nivel-3{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25)}

/* PRÁCTICA */
.q-num{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
.q-counter{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.qc-label{font-size:.75rem;color:var(--muted)}
.qc-dots{display:flex;gap:5px}
.qc-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.15)}
.qc-dot.done{background:var(--green)}
.qc-dot.current{background:var(--gold)}
.q-text{font-family:var(--serif);font-size:1.1rem;line-height:1.4;margin-bottom:6px}
.q-tip{font-size:.75rem;color:var(--muted);font-style:italic;margin-bottom:14px;line-height:1.5}
.q-input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);
  border-radius:10px;padding:13px;color:var(--white);font-family:var(--sans);
  font-size:.875rem;resize:vertical;min-height:80px;transition:border-color .2s}
.q-input:focus{outline:none;border-color:rgba(245,200,66,.4);background:rgba(255,255,255,.07)}
.q-input::placeholder{color:rgba(255,255,255,.2)}
.q-btn{width:100%;margin-top:10px;padding:13px;background:var(--navy3);
  color:var(--white);border:1px solid var(--border);border-radius:50px;
  font-family:var(--sans);font-size:.875rem;font-weight:600;cursor:pointer;transition:all .2s}
.q-btn:hover{background:rgba(245,200,66,.1);border-color:rgba(245,200,66,.3)}
.feedback{display:none;margin-top:12px;border-radius:var(--r);padding:14px}
.feedback.bien{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.25)}
.feedback.mejorar{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25)}
.feedback.riesgo{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25)}
.fb-estado{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.feedback.bien .fb-estado{color:var(--green)}
.feedback.mejorar .fb-estado{color:var(--amber)}
.feedback.riesgo .fb-estado{color:var(--red)}
.fb-msg{font-size:.8125rem;color:rgba(255,255,255,.8);line-height:1.6}
.fb-model{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08)}
.fb-model-label{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:rgba(255,255,255,.4);margin-bottom:5px}
.fb-model-text{font-size:.8rem;color:rgba(255,255,255,.6);line-height:1.6;font-style:italic}

/* BOTONES */
.btn-primary{width:100%;padding:15px;background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:var(--navy);border:none;border-radius:50px;font-family:var(--sans);
  font-size:.9375rem;font-weight:800;cursor:pointer;transition:all .25s var(--ease)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 40px rgba(245,200,66,.3)}
.btn-secondary{width:100%;padding:13px;background:transparent;
  color:var(--muted);border:1px solid var(--border);border-radius:50px;
  font-family:var(--sans);font-size:.875rem;cursor:pointer;margin-top:10px;transition:all .2s}
.btn-secondary:hover{border-color:rgba(245,200,66,.3);color:var(--gold)}
.btn-next{width:100%;margin-top:14px;padding:14px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:var(--navy);border:none;border-radius:50px;
  font-family:var(--sans);font-size:.875rem;font-weight:800;cursor:pointer;transition:all .25s}

/* RESULTADO */
.score-ring{width:110px;height:110px;border-radius:50%;margin:0 auto 18px;
  display:flex;align-items:center;justify-content:center;flex-direction:column}
.score-num{font-family:var(--serif);font-size:2.4rem;font-weight:700;line-height:1}
.score-lbl{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.wa-cta{display:flex;align-items:center;gap:10px;background:rgba(16,185,129,.1);
  border:1px solid rgba(16,185,129,.25);border-radius:var(--r);padding:14px;
  text-decoration:none;color:var(--white);font-size:.875rem;font-weight:600;margin-top:8px}

/* ── JS-GENERATED SCREENS ── */
.js-screen-c{text-align:center;padding:8px 0}
.js-icon{font-size:1.8rem;margin-bottom:12px}
.js-h1{font-family:var(--serif);font-size:clamp(1.5rem,6vw,2.2rem);font-weight:700;line-height:1.2;margin-bottom:10px;color:#F1F5F9}
.js-h2{font-family:var(--serif);font-size:clamp(1.2rem,5vw,1.6rem);font-weight:700;margin-bottom:10px;color:#F1F5F9}
.js-p{font-size:.85rem;color:rgba(255,255,255,.5);margin-bottom:6px}
.js-p-gold{font-size:.78rem;color:rgba(245,200,66,.7);font-weight:600;margin-bottom:24px}
.js-p-sub{font-size:.88rem;color:rgba(255,255,255,.5);margin-bottom:24px;line-height:1.6}
.js-badge{display:inline-block;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#F5C842;background:rgba(245,200,66,.08);border:1px solid rgba(245,200,66,.2);padding:5px 12px;border-radius:99px;margin-bottom:18px}
.js-btn-gold{display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#F5C842,#C8861A);color:#060E1F;font-weight:800;font-size:.88rem;padding:15px 20px;border-radius:50px;border:none;cursor:pointer;font-family:var(--sans);width:100%;margin-bottom:10px;line-height:1.35;word-break:break-word;text-align:center;box-sizing:border-box}
.js-btn-ghost{display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.6);font-size:.83rem;font-weight:500;padding:13px 20px;border-radius:50px;cursor:pointer;font-family:var(--sans);width:100%;line-height:1.35;word-break:break-word;text-align:center;box-sizing:border-box}
.js-btn-link{font-size:.72rem;color:rgba(255,255,255,.3);background:none;border:none;cursor:pointer;font-family:var(--sans);display:block;width:100%;text-align:center;margin-top:12px;padding:8px 0}
.js-study-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:8px}
.js-study-tag{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(59,130,246,.9);background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.2);padding:4px 10px;border-radius:99px;white-space:nowrap;flex-shrink:0}
.js-study-counter{font-size:.72rem;color:rgba(255,255,255,.4);white-space:nowrap}
.js-prog{height:3px;background:rgba(255,255,255,.06);border-radius:99px;margin-bottom:20px;overflow:hidden}
.js-q-num-sm{font-size:.63rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.3);margin-bottom:8px}
.js-q-text{font-family:var(--serif);font-size:clamp(.9rem,3.5vw,1.1rem);font-weight:700;color:#F1F5F9;line-height:1.45;margin-bottom:18px;overflow-wrap:break-word;word-break:break-word}
.js-model-box{background:rgba(59,130,246,.06);border-left:3px solid #3B82F6;border-radius:0 12px 12px 0;padding:14px;margin-bottom:24px}
.js-model-label{font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#60A5FA;margin-bottom:7px}
.js-model-text{font-size:.83rem;color:rgba(255,255,255,.8);line-height:1.7;font-style:italic;overflow-wrap:break-word;word-break:break-word}

/* ── RESPONSIVE MOBILE ── */
@media(max-width:520px){
  .welcome-title{font-size:clamp(1.6rem,7vw,2.4rem)}
  .mod-title{font-size:clamp(1.3rem,6vw,1.8rem)}
  .hdr-prog{font-size:.6rem}
  .fam-card{padding:12px}
  .fam-name{font-size:.9rem}
  .trip-row{font-size:.75rem;flex-wrap:wrap;gap:2px}
  .trip-v{text-align:right;flex:1}
  .ds-field{padding:10px}
  .ds-value{font-size:.8rem}
  .btn-primary,.btn-secondary,.btn-next,.q-btn{font-size:.85rem;padding:14px}
  .mode-btn{padding:12px}
  .score-ring{width:90px;height:90px}
  .score-num{font-size:2rem}
  .q-text{font-size:1rem}
  .q-input{min-height:70px;font-size:.85rem}
}
@media(max-width:380px){
  .hdr-prog{display:none}
  .fam-badge{font-size:.58rem;padding:4px 10px}
  .ds-sub{font-size:.7rem}
}
</style>
</head>

const MODULES = [

// ─── GUARDAR AVANCE (localStorage) ───────────────────────────────
function saveProgress(){
  try {
    var key = 'avance_' + (_miembro || 'familia');
    localStorage.setItem(key, JSON.stringify({
      cur: cur, qIdx: qIdx, answers: answers,
      miembro: _miembro || null,
      fecha: new Date().toISOString()
    }));
  } catch(e){}
}

function loadProgress(){
  try {
    var key = 'avance_' + (_miembro || 'familia');
    var saved = localStorage.getItem(key);
    if(!saved) return null;
    return JSON.parse(saved);
  } catch(e){ return null; }
}

function clearProgress(){
  try {
    var key = 'avance_' + (_miembro || 'familia');
    localStorage.removeItem(key);
  } catch(e){}
}

// ─── MODO ESTUDIO ─────────────────────────────────────────────────
var studyMember = null;
var studyQIdx = 0;
var studyQs = [];

var STUDY_QS = {
  paul: [], jenny: [], mileidy: [], paulsmith: []
};

function buildStudyQs(){
  MODULES.forEach(function(mod){
    if(mod.type !== 'quiz' || !mod.questions) return;
    var id = mod.id || '';
    if(/paul-n/.test(id)) STUDY_QS.paul = STUDY_QS.paul.concat(mod.questions);
    else if(/jenny-p/.test(id)) STUDY_QS.jenny = STUDY_QS.jenny.concat(mod.questions);
    else if(/mileidy-p/.test(id)) STUDY_QS.mileidy = STUDY_QS.mileidy.concat(mod.questions);
    else if(/paulsmith-p/.test(id)) STUDY_QS.paulsmith = STUDY_QS.paulsmith.concat(mod.questions);
    else if(/viaje-p/.test(id)||/dificil-p/.test(id)){
      STUDY_QS.paul = STUDY_QS.paul.concat(mod.questions);
      STUDY_QS.jenny = STUDY_QS.jenny.concat(mod.questions);
      STUDY_QS.mileidy = STUDY_QS.mileidy.concat(mod.questions);
      STUDY_QS.paulsmith = STUDY_QS.paulsmith.concat(mod.questions);
    }
  });
}

function startStudy(member, practiceIdx){
  buildStudyQs();
  studyMember = member;
  studyQIdx = 0;
  studyQs = STUDY_QS[member] || [];
  window._practiceIdx = practiceIdx;
  renderStudyCard();
}

function renderStudyCard(){
  const wrap = document.getElementById('wrap');
  if(studyQIdx >= studyQs.length){
    wrap.innerHTML = '<div class="screen js-screen-c">'
      + '<div class="js-icon">🎯</div>'
      + '<h2 class="js-h2">Ya estudiaste todas las preguntas</h2>'
      + '<p class="js-p-sub">Ahora es tu turno de responder solo.<br>Vamos a ver cuanto recordas.</p>'
      + '<button class="js-btn-gold" onclick="jumpTo('+window._practiceIdx+')">Practicar solo ahora</button>'
      + '<button class="js-btn-ghost" onclick="studyQIdx=0;renderStudyCard()">Repasar las preguntas otra vez</button>'
      + '</div>';
    return;
  }
  const q = studyQs[studyQIdx];
  const total = studyQs.length;
  const pct = Math.round((studyQIdx/total)*100);
  const btnTxt = studyQIdx < total-1 ? 'Lo entendí, siguiente' : 'Terminar de estudiar';
  wrap.innerHTML = '<div class="screen">'
    + '<div class="js-study-bar">'
    + '<span class="js-study-tag">Modo estudio</span>'
    + '<span class="js-study-counter">' + (studyQIdx+1) + ' de ' + total + '</span>'
    + '</div>'
    + '<div class="js-prog"><div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,#3B82F6,#F5C842);transition:width .3s"></div></div>'
    + '<div class="js-q-num-sm">Pregunta ' + (studyQIdx+1) + '</div>'
    + '<div class="js-q-text">' + q.q + '</div>'
    + '<div class="js-model-box">'
    + '<div class="js-model-label">Respuesta correcta</div>'
    + '<div class="js-model-text">' + q.model + '</div>'
    + '</div>'
    + '<button class="js-btn-gold" onclick="studyQIdx++;renderStudyCard()">' + btnTxt + '</button>'
    + '<button class="js-btn-ghost" onclick="jumpTo('+window._practiceIdx+')">Saltar y practicar ahora</button>'
    + '</div>';
}

// ─── ENGINE ───────────────────────────────────────────────────────
function updateHeader(){
  const total=MODULES.length-1;
  document.getElementById('hdr-mod').textContent=cur+1;
  document.getElementById('hdr-tot').textContent=total;
  const pct=Math.round((cur/total)*100);
  document.getElementById('prog-fill').style.width=pct+'%';
}

function render(){
  updateHeader();
  const mod=MODULES[cur];
  const wrap=document.getElementById('wrap');
  if(mod.type==='quiz') renderQuiz(mod);
  else wrap.innerHTML=mod.render();
  var dcEl=document.getElementById('dc-sim');
  if(dcEl){var d=Math.ceil((new Date('2026-07-31')-new Date())/864e5);dcEl.textContent=d>0?d:'HOY';}
  window.scrollTo({top:0,behavior:'smooth'});
  saveProgress();
}

function renderQuiz(mod){
  const q=mod.questions[qIdx];
  const total=mod.questions.length;
  const dots=mod.questions.map((_,i)=>`<div class="qc-dot ${i<qIdx?'done':i===qIdx?'current':''}"></div>`).join('');
  document.getElementById('wrap').innerHTML=`<div class="screen">
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:14px">
      <span class="mod-tag practice" style="margin-bottom:0">${mod.persona}</span>
      <span class="nivel-badge ${mod.nivel}" style="margin-bottom:0">${mod.nivelTxt}</span>
    </div>
    <div class="q-counter">
      <span class="qc-label">Pregunta ${qIdx+1} de ${total}</span>
      <div class="qc-dots">${dots}</div>
    </div>
    <div class="q-num">Pregunta ${qIdx+1}</div>
    <div class="q-text">${q.q}</div>
    <p class="q-tip">${q.tip}</p>
    <textarea class="q-input" id="q-inp" placeholder="Escribe tu respuesta aquí..."></textarea>
    <button class="q-btn" id="q-btn" onclick="evalQ()">Evaluar respuesta</button>
    <div class="feedback" id="feedback"></div>
    <button class="btn-next hidden" id="btn-next" onclick="nextQ()">
      ${qIdx===total-1?'Siguiente módulo →':'Siguiente pregunta →'}
    </button>
  </div>`;
}

function evalQ(){
  const mod=MODULES[cur];
  const q=mod.questions[qIdx];
  const inp=document.getElementById('q-inp').value.trim();
  if(!inp){alert('Escribe tu respuesta primero.');return;}
  const res=q.eval(inp);
  answers.push(res.s);
  const fb=document.getElementById('feedback');
  const icons={bien:'✅',mejorar:'⚠️',riesgo:'🚨'};
  const estados={bien:'Respuesta sólida',mejorar:'Puede mejorar',riesgo:'Necesita trabajo'};
  fb.className='feedback '+res.s;
  fb.innerHTML=`<div class="fb-estado">${icons[res.s]} ${estados[res.s]}</div>
    <div class="fb-msg">${res.m}</div>
    <div class="fb-model">
      <div class="fb-model-label">Respuesta modelo:</div>
      <div class="fb-model-text">${q.model}</div>
    </div>`;
  fb.style.display='block';
  document.getElementById('btn-next').classList.remove('hidden');
  document.getElementById('q-btn').disabled=true;
  document.getElementById('q-inp').disabled=true;
}

function nextQ(){
  const mod=MODULES[cur];
  if(qIdx<mod.questions.length-1){qIdx++;render();}
  else{qIdx=0;next();}
}

function next(){if(cur<MODULES.length-1){cur++;render();}}
function prev(){if(cur>0){qIdx=0;cur--;render();}}
function jumpTo(idx){qIdx=0;cur=idx;render();}
function restart(){cur=0;qIdx=0;answers=[];clearProgress();render();}

// Detectar miembro desde URL
var _miembro = new URLSearchParams(location.search).get('miembro');
var _perfiles = {
  paul:      {idx:3,  n:'Paul Fernando', c:'Alcalde de Paquisha',        m:'DS-160 + 15 preguntas en 3 niveles'},
  jenny:     {idx:7,  n:'Jenny Enid',    c:'Granja "El Piolin" + Patronato', m:'DS-160 + 5 preguntas'},
  mileidy:   {idx:9,  n:'Mileidy Maily', c:'Estudiante, 19 anos, Paquisha',  m:'DS-160 + 5 preguntas'},
  paulsmith: {idx:11, n:'Paul Smith',    c:'Estudiante, 12 anos, Paquisha',  m:'DS-160 + 5 preguntas + ingles'}
};

if(_miembro && _perfiles[_miembro.toLowerCase()]){
  var _pr = _perfiles[_miembro.toLowerCase()];
  document.title = 'Preparacion ' + _pr.n;
  var _saved = loadProgress();
  if(_saved && _saved.miembro === _miembro && _saved.cur > 0){
    cur=_saved.cur; qIdx=_saved.qIdx; answers=_saved.answers;
  } else {
    cur=_pr.idx; qIdx=0; answers=[];
  }
  render();
} else {
  render();
}
</script>
