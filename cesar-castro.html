<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preparación Entrevista — César Castro · Visa B1/B2 USA</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#060E1F;--navy2:#0d1a30;--navy3:#162840;--gold:#F5C842;--gold2:#C8861A;--gold-dim:rgba(245,200,66,.1);--green:#10B981;--red:#EF4444;--amber:#F59E0B;--blue:#3B82F6;--white:#fff;--muted:rgba(255,255,255,.5);--border:rgba(255,255,255,.08);--card:rgba(255,255,255,.04);--sans:'Space Grotesk',sans-serif;--serif:'Playfair Display',serif;--r:14px}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--navy);color:var(--white);min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 50% at 15% 0%,rgba(245,200,66,.06),transparent 55%),radial-gradient(ellipse 60% 40% at 85% 100%,rgba(59,130,246,.05),transparent 60%),var(--navy)}
.hdr{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(6,14,31,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center}
.logo{font-family:var(--serif);font-size:.875rem;font-weight:700}
.logo em{color:var(--gold);font-style:italic}
.hdr-right{margin-left:auto}
.hdr-prog{font-size:.7rem;color:var(--muted)}
.hdr-prog strong{color:var(--gold)}
.prog-bar{position:fixed;top:56px;left:0;right:0;z-index:99;height:3px;background:rgba(255,255,255,.06)}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--blue));transition:width .5s ease;width:0%}
.main{position:relative;z-index:1;padding:72px 16px 48px}
.wrap{max-width:640px;margin:0 auto}
.screen{animation:fadeUp .3s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.hidden{display:none!important}

/* badges */
.badge-gold{display:inline-flex;align-items:center;gap:8px;font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);background:var(--gold-dim);border:1px solid rgba(245,200,66,.2);padding:5px 14px;border-radius:99px;margin-bottom:20px}
.badge-gold span{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.mod-tag{display:inline-block;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;padding:4px 12px;border-radius:99px;margin-bottom:12px}
.mod-tag.learn{background:rgba(59,130,246,.15);color:var(--blue);border:1px solid rgba(59,130,246,.2)}
.mod-tag.practice{background:rgba(16,185,129,.15);color:var(--green);border:1px solid rgba(16,185,129,.2)}
.mod-tag.tip{background:rgba(245,200,66,.12);color:var(--gold);border:1px solid rgba(245,200,66,.2)}
.mod-tag.review{background:rgba(124,58,237,.15);color:#A78BFA;border:1px solid rgba(124,58,237,.2)}
.nivel-badge{display:inline-flex;align-items:center;gap:6px;font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:99px;margin-bottom:14px}
.n1{background:rgba(16,185,129,.12);color:var(--green);border:1px solid rgba(16,185,129,.25)}
.n2{background:rgba(245,158,11,.12);color:var(--amber);border:1px solid rgba(245,158,11,.25)}
.n3{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25)}

/* typography */
.h1{font-family:var(--serif);font-size:clamp(2rem,6vw,2.8rem);line-height:1.15;margin-bottom:14px}
.h1 em{color:var(--gold);font-style:italic}
.h2{font-family:var(--serif);font-size:clamp(1.5rem,4vw,2rem);line-height:1.2;margin-bottom:8px}
.h2 em{color:var(--gold);font-style:italic}
.sub{font-size:.9rem;color:var(--muted);line-height:1.7;margin-bottom:20px}

/* cards */
.info-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px}
.ic-num{font-family:var(--serif);font-size:1.8rem;font-weight:700;color:rgba(245,200,66,.2);line-height:1;margin-bottom:7px}
.ic-title{font-weight:700;font-size:.9375rem;margin-bottom:5px}
.ic-body{font-size:.8125rem;color:rgba(255,255,255,.6);line-height:1.65}
.str-card{background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.2);border-radius:var(--r);padding:14px;margin-bottom:8px;display:flex;gap:12px}
.str-icon{font-size:1.2rem;flex-shrink:0}
.str-title{font-weight:700;font-size:.875rem;margin-bottom:3px}
.str-body{font-size:.8rem;color:rgba(255,255,255,.55);line-height:1.55}
.risk-card{background:rgba(239,68,68,.04);border:1px solid rgba(239,68,68,.2);border-radius:var(--r);padding:14px;margin-bottom:8px;display:flex;gap:12px}
.resp-box{background:rgba(59,130,246,.06);border-left:3px solid var(--blue);border-radius:0 var(--r) var(--r) 0;padding:14px;margin:10px 0}
.resp-label{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--blue);margin-bottom:7px}
.resp-text{font-size:.875rem;color:rgba(255,255,255,.8);line-height:1.7;font-style:italic}

/* trip box */
.trip-box{background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.2);border-radius:var(--r);padding:16px;margin-bottom:20px}
.trip-ttl{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--blue);margin-bottom:10px}
.trip-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.8rem}
.trip-row:last-child{border-bottom:none}
.trip-l{color:var(--muted)}.trip-v{font-weight:600}

/* ds-160 */
.ds-header{background:linear-gradient(135deg,var(--navy2),var(--navy3));border:1px solid rgba(245,200,66,.2);border-radius:var(--r);padding:18px;margin-bottom:14px}
.ds-name{font-family:var(--serif);font-size:1.3rem;font-weight:700;margin-bottom:4px}
.ds-sub{font-size:.8rem;color:rgba(245,200,66,.8);font-weight:600}
.ds-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.ds-field{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px}
.ds-label{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.ds-value{font-size:.875rem;font-weight:600;line-height:1.4}
.ds-field.hi{border-color:rgba(245,200,66,.3);background:rgba(245,200,66,.05)}
.ds-field.ok{border-color:rgba(16,185,129,.25);background:rgba(16,185,129,.05)}
.ds-field.wn{border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.05)}
.ds-note{background:rgba(59,130,246,.06);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;padding:12px 14px;margin-bottom:14px;font-size:.825rem;color:rgba(255,255,255,.75);line-height:1.6}

/* mode buttons */
.mode-box{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.mode-btn{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;cursor:pointer;text-align:left;color:var(--white);width:100%}
.mode-btn:hover{border-color:rgba(245,200,66,.3);background:rgba(245,200,66,.04)}
.mode-icon{font-size:1.4rem;flex-shrink:0}
.mode-title{font-weight:700;font-size:.875rem;margin-bottom:2px}
.mode-sub{font-size:.72rem;color:var(--muted)}

/* practice */
.q-counter{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.qc-label{font-size:.75rem;color:var(--muted)}
.qc-dots{display:flex;gap:5px}
.qc-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.15)}
.qc-dot.done{background:var(--green)}
.qc-dot.cur{background:var(--gold)}
.q-text{font-family:var(--serif);font-size:1.1rem;line-height:1.4;margin-bottom:6px}
.q-tip{font-size:.75rem;color:var(--muted);font-style:italic;margin-bottom:14px;line-height:1.5}
.q-input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;padding:13px;color:var(--white);font-family:var(--sans);font-size:.875rem;resize:vertical;min-height:80px}
.q-input:focus{outline:none;border-color:rgba(245,200,66,.4)}
.q-input::placeholder{color:rgba(255,255,255,.2)}
.fb{display:none;margin-top:12px;border-radius:var(--r);padding:14px}
.fb.bien{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.25)}
.fb.mejorar{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25)}
.fb-estado{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.fb.bien .fb-estado{color:var(--green)}
.fb.mejorar .fb-estado{color:var(--amber)}
.fb-msg{font-size:.8125rem;color:rgba(255,255,255,.8);line-height:1.6}
.fb-model{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08)}
.fb-model-label{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.4);margin-bottom:5px}
.fb-model-text{font-size:.8rem;color:rgba(255,255,255,.6);line-height:1.6;font-style:italic}

/* buttons */
.btn-p{width:100%;padding:15px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy);border:none;border-radius:50px;font-family:var(--sans);font-size:.9375rem;font-weight:800;cursor:pointer;margin-bottom:10px}
.btn-s{width:100%;padding:13px;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:50px;font-family:var(--sans);font-size:.875rem;cursor:pointer;margin-bottom:10px}
.btn-vrf{width:100%;margin-top:10px;padding:13px;background:var(--navy3);color:var(--white);border:1px solid var(--border);border-radius:50px;font-family:var(--sans);font-size:.875rem;font-weight:600;cursor:pointer}
.btn-nxt{width:100%;margin-top:10px;padding:14px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy);border:none;border-radius:50px;font-family:var(--sans);font-size:.875rem;font-weight:800;cursor:pointer}

/* result */
.score-ring{width:110px;height:110px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;flex-direction:column}
.score-num{font-family:var(--serif);font-size:2.4rem;font-weight:700;line-height:1}
.score-lbl{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.wa-cta{display:flex;align-items:center;gap:10px;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.25);border-radius:var(--r);padding:14px;text-decoration:none;color:var(--white);font-size:.875rem;font-weight:600;margin-bottom:10px}

@media(max-width:520px){.ds-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="bg"></div>
<header class="hdr">
  <div class="logo">Asesori&#769;a <em>Visa</em> Global</div>
  <div class="hdr-right"><span class="hdr-prog">Mo&#769;dulo <strong id="hm">1</strong> de <strong id="ht">8</strong></span></div>
</header>
<div class="prog-bar"><div class="prog-fill" id="pf"></div></div>
<main class="main"><div class="wrap" id="wrap"></div></main>

<script>
'use strict';
var cur=0, qIdx=0, scores=[];

/* ── DATOS ─────────────────────────────────────────── */
var QB=[
  {q:"Cual es el proposito de su viaje a los Estados Unidos?",
   tip:"Primera pregunta siempre. Sea directo. Mencione COMAGA y el Comite Civico.",
   model:"Voy en representacion oficial del COMAGA — Consorcio de Municipios Amazonicos y Galapagos, del cual soy presidente. Tenemos coordinacion con la comunidad ecuatoriana en Nueva York a traves del Comite Civico Ecuatoriano. Es un viaje institucional de seis dias.",
   kw:["comaga","comite","municipio","representacion","institucional","seis","6"]},
  {q:"Cuanto tiempo planea quedarse?",
   tip:"Respuesta corta y precisa. De las fechas exactas.",
   model:"Seis dias. Llego el 30 de julio y regreso el 5 de agosto.",
   kw:["seis","6","julio","agosto","30","5"]},
  {q:"Donde va a hospedarse?",
   tip:"De la direccion exacta. Long Island City, Queens.",
   model:"En un domicilio en Long Island City, Queens, en el 38-70 de la calle 12. Es donde me hospedan durante las actividades institucionales.",
   kw:["queens","long island","12","hospedan"]},
  {q:"Quien le paga el viaje?",
   tip:"Usted mismo, con sus propios recursos.",
   model:"Lo pago yo mismo, con mis propios recursos. Es un viaje personal en representacion del cargo.",
   kw:["yo","propios","mismo","recursos"]},
  {q:"Tiene familiares en los Estados Unidos?",
   tip:"No tiene ningun familiar en USA. Respuesta directa.",
   model:"No, no tengo familiares en los Estados Unidos.",
   kw:["no"]}
];

var QI=[
  {q:"Cual es su ocupacion actual?",
   tip:"De todo el contexto: Alcalde + COMAGA. Es su fortaleza mas grande.",
   model:"Soy Alcalde del GAD Municipal de Santa Clara, en la provincia de Pastaza. Ademas soy presidente del COMAGA, el Consorcio de Municipios Amazonicos y Galapagos, que agrupa a los municipios amazonicos del Ecuador.",
   kw:["alcalde","santa clara","pastaza","comaga","consorcio","municipios"]},
  {q:"Cuanto gana usted actualmente?",
   tip:"Sea preciso. Es el salario oficial del cargo.",
   model:"Cuatro mil cuatrocientos setenta y cuatro dolares mensuales. Es el salario establecido para el cargo de alcalde.",
   kw:["4474","cuatro mil","cuatrocientos","salario","mensual"]},
  {q:"Por que viaja solo y no con su esposa?",
   tip:"Es un viaje de trabajo institucional. Simple.",
   model:"Es un viaje de trabajo, no turismo. Mi esposa permanece en Ecuador. Tengo compromisos como alcalde que me obligan a regresar el 5 de agosto.",
   kw:["trabajo","institucional","ecuador","regresar","agosto"]},
  {q:"Con quien exactamente se va a reunir en Nueva York?",
   tip:"El Comite Civico Ecuatoriano en Elmhurst. Organizacion, no persona individual.",
   model:"Con el Comite Civico Ecuatoriano de Nueva York, en Elmhurst, Queens. Es una organizacion reconocida de la comunidad ecuatoriana que coordina con municipios como el nuestro.",
   kw:["comite","civico","ecuatoriano","elmhurst","queens","organizacion"]},
  {q:"Quien administra el canton mientras usted esta fuera?",
   tip:"El vicealcalde. Procedimiento normal establecido por ley.",
   model:"El vicealcalde asume mis funciones durante mi ausencia, como establece la Ley Organica de Organizacion Territorial. Seis dias es un tiempo completamente manejable.",
   kw:["vicealcalde","ley","seis","6","ausencia"]}
];

var QD=[
  {q:"Por que nunca ha viajado a los Estados Unidos si tiene un cargo tan importante?",
   tip:"No se disculpe. Primera oportunidad institucional. Pasaporte vigente.",
   model:"Esta es la primera vez que surge la oportunidad institucional de representar al COMAGA en Nueva York. Mi trabajo como alcalde esta centrado en el canton. Tengo el pasaporte vigente, viajo cuando hay razon concreta — y esta es esa razon.",
   kw:["primera","oportunidad","comaga","pasaporte","razon","canton"]},
  {q:"No conoce el nombre de ninguna persona de contacto en USA. Con quien habla?",
   tip:"Contacto institucional, no personal. Sea seguro al explicarlo.",
   model:"El contacto es institucional. Me coordino directamente con el Comite Civico Ecuatoriano como organizacion. No es una persona individual — es una entidad reconocida con direccion y telefono oficial en Elmhurst, Queens.",
   kw:["institucional","comite","organizacion","entidad","elmhurst"]},
  {q:"Por que se hospeda en Queens y no en Manhattan, donde suelen hacerse reuniones de negocios?",
   tip:"Porque el Comite Civico esta en Elmhurst, Queens. Logica geografica.",
   model:"Porque el Comite Civico Ecuatoriano esta en Elmhurst, Queens, el barrio con mayor presencia ecuatoriana en Nueva York. Me alojo cerca del lugar donde voy a realizar las actividades. Es lo mas logico.",
   kw:["elmhurst","queens","ecuatoriana","comite","cerca","logico"]},
  {q:"Solo 6 dias para un viaje institucional... no es muy poco tiempo?",
   tip:"Seis dias es suficiente. Y tiene obligaciones que lo obligan a regresar.",
   model:"Seis dias es suficiente para los encuentros programados y conocer de cerca la comunidad ecuatoriana en Nueva York. Tengo sesiones de cabildo el 6 de agosto — como alcalde, mi presencia es obligatoria.",
   kw:["seis","6","cabildo","agosto","alcalde","obligatorio","sesiones"]},
  {q:"Que garantia me da de que regresara al Ecuador?",
   tip:"Su cargo. La garantia mas fuerte que existe.",
   model:"Soy alcalde en ejercicio. Tengo sesiones de cabildo programadas, obras publicas en ejecucion y un canton de 3.000 habitantes que administrar. El cargo me obliga juridicamente a estar presente. Mi vida y responsabilidad estan en Santa Clara.",
   kw:["alcalde","cabildo","obras","canton","responsabilidad","santa clara","juridicamente"]}
];

/* Normalize: remove accents, lowercase */
function norm(s){
  return s.toLowerCase()
    .replace(/[áàäâ]/g,'a').replace(/[éèëê]/g,'e')
    .replace(/[íìïî]/g,'i').replace(/[óòöô]/g,'o')
    .replace(/[úùüû]/g,'u').replace(/[ñ]/g,'n');
}

/* ── NAV ─────────────────────────────────────────── */
function goTo(n){cur=n;qIdx=0;render();}
function next(){goTo(Math.min(cur+1,7));}
function prev(){goTo(Math.max(cur-1,0));}

/* ── PRACTICE EVAL ────────────────────────────────── */
function check(){
  var pqs=cur===4?QB:cur===5?QI:QD;
  var q=pqs[qIdx];
  var resp=norm(document.getElementById('qa').value||'');
  var hits=q.kw.filter(function(k){return resp.indexOf(k)>=0;}).length;
  var ok=hits>=Math.ceil(q.kw.length*0.4)&&resp.length>15;
  scores.push(ok);
  var fb=document.getElementById('fb');
  fb.className='fb '+(ok?'bien':'mejorar');
  document.getElementById('fb-estado').textContent=ok?'Bien — respuesta completa':'Mejorar — faltan elementos clave';
  document.getElementById('fb-msg').textContent=ok?'Buena respuesta. Cubre los puntos esenciales.':'Revisa la respuesta modelo. Asegurate de incluir los detalles especificos.';
  document.getElementById('fb-model').textContent=q.model;
  fb.style.display='block';
  document.getElementById('btn-nxt').classList.remove('hidden');
  document.getElementById('qa').disabled=true;
  document.getElementById('btn-vrf').disabled=true;
}

function nextQ(){
  var pqs=cur===4?QB:cur===5?QI:QD;
  qIdx++;
  if(qIdx>=pqs.length){render();}else{render();}
}

/* ── RENDER ───────────────────────────────────────── */
function setHdr(){
  document.getElementById('hm').textContent=cur+1;
  document.getElementById('ht').textContent=8;
  document.getElementById('pf').style.width=(cur/7*100)+'%';
  window.scrollTo(0,0);
}

function dias(){
  var d=Math.ceil((new Date('2026-07-14')-new Date())/86400000);
  return d>0?d:'Hoy';
}

function mkDots(pqs){
  return pqs.map(function(_,i){
    return '<div class="qc-dot'+(i<qIdx?' done':i===qIdx?' cur':'')+'"></div>';
  }).join('');
}

function renderPractica(pqs,nivel,cls,titulo){
  if(qIdx>=pqs.length){
    var t=pqs.length,b=0;
    for(var i=scores.length-t;i<scores.length;i++){if(scores[i])b++;}
    document.getElementById('wrap').innerHTML='<div class="screen" style="text-align:center">'
      +'<div style="font-size:2rem;margin-bottom:12px">'+(b===t?'&#127881;':'&#128170;')+'</div>'
      +'<div class="h2">Nivel '+nivel+'<br><em>completado</em></div>'
      +'<p class="sub">'+b+' de '+t+' respuestas completas.</p>'
      +'<button class="btn-p" onclick="next()">Continuar &#8594;</button>'
      +'<button class="btn-s" onclick="goTo(cur)">Repetir este nivel</button>'
      +'</div>';
    return;
  }
  var q=pqs[qIdx];
  document.getElementById('wrap').innerHTML='<div class="screen">'
    +'<span class="nivel-badge '+cls+'">'+titulo+' &#8212; '+(qIdx+1)+' de '+pqs.length+'</span>'
    +'<div class="q-counter"><span class="qc-label">Preguntas</span><div class="qc-dots">'+mkDots(pqs)+'</div></div>'
    +'<p class="q-text">&#8810;&#8811; '+q.q+'</p>'
    +'<p class="q-tip">&#128161; '+q.tip+'</p>'
    +'<textarea class="q-input" id="qa" placeholder="Escribe tu respuesta aqui..."></textarea>'
    +'<button class="btn-vrf" id="btn-vrf" onclick="check()">Verificar &#8594;</button>'
    +'<div class="fb" id="fb" style="display:none">'
      +'<div class="fb-estado" id="fb-estado"></div>'
      +'<div class="fb-msg" id="fb-msg"></div>'
      +'<div class="fb-model"><div class="fb-model-label">Respuesta modelo</div>'
      +'<div class="fb-model-text" id="fb-model"></div></div>'
    +'</div>'
    +'<button class="btn-nxt hidden" id="btn-nxt" onclick="nextQ()">'+(qIdx+1<pqs.length?'Siguiente pregunta &#8594;':'Ver resumen &#8594;')+'</button>'
    +'<button class="btn-s" style="margin-top:20px" onclick="prev()">&#8592; Anterior</button>'
    +'</div>';
}

function render(){
  setHdr();
  var w=document.getElementById('wrap');
  if(cur===0){renderBienvenida();}
  else if(cur===1){renderEvalua();}
  else if(cur===2){renderFortalezas();}
  else if(cur===3){renderDS160();}
  else if(cur===4){renderPractica(QB,'basico','n1','&#9679; Nivel basico');}
  else if(cur===5){renderPractica(QI,'intermedio','n2','&#9679; Nivel intermedio');}
