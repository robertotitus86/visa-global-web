<!DOCTYPE html>
<html lang="es">
<head>
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
<script>if(location.protocol!=="https:")location.replace("https:"+location.href.substring(location.protocol.length));</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procesando pago — Asesoría Visa Global</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: sans-serif; background: #060E1F; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { text-align: center; max-width: 400px; }
  .logo { font-size: 22px; font-weight: 700; color: #F0B429; margin-bottom: 32px; letter-spacing: 1px; }
  .spinner { width: 52px; height: 52px; border: 4px solid #1a2d50; border-top-color: #F0B429; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 24px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { color: #a0aec0; font-size: 16px; line-height: 1.6; }
  .btn { display: inline-block; margin-top: 20px; background: #25D366; color: #fff; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; }
</style>
<link rel="stylesheet" href="/design.css">
</head>
<body>
<div class="card">
  <div class="logo">ASESORÍA VISA GLOBAL</div>
  <div class="spinner" id="spinner"></div>
  <p id="msg">Preparando tu pago seguro...</p>
  <a href="https://wa.me/593994442512" class="btn" id="btnWa" style="display:none">Escribir al asesor</a>
</div>
<script>
  const url = new URLSearchParams(window.location.search).get('url');
  if (url) {
    setTimeout(() => { window.location.href = decodeURIComponent(url); }, 800);
  } else {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('msg').textContent = 'Link de pago no válido. Contáctanos por WhatsApp.';
    document.getElementById('btnWa').style.display = 'inline-block';
  }
</script>
</body>
</html>
