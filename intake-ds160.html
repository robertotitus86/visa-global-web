<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tu visa USA empieza aquí · Asesoría Visa Global</title>
<meta name="description" content="Cuéntanos tu situación en 10 minutos. Nosotros preparamos todo: análisis, documentos y solicitud ante la embajada americana.">
<meta property="og:title" content="Empieza tu visa USA · Asesoría Visa Global">
<meta property="og:description" content="Solo 10 minutos. Nosotros preparamos todo por ti.">
<meta property="og:image" content="https://www.asesoriadevisadosglobal.com/cfb1.png">
<meta property="og:url" content="https://www.asesoriadevisadosglobal.com/intake-ds160.html">
<meta name="theme-color" content="#060D1A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ──────────────────────────────────── */
:root {
  --bg:     oklch(8%  0.020 250);
  --bg2:    oklch(12% 0.024 250);
  --bg3:    oklch(16% 0.026 250);
  --gold:   oklch(72% 0.160 85);
  --golddim:oklch(72% 0.160 85 / 14%);
  --goldbdr:oklch(72% 0.160 85 / 30%);
  --text:   oklch(92% 0.010 250);
  --muted:  oklch(58% 0.014 250);
  --dim:    oklch(35% 0.012 250);
  --grn:    oklch(64% 0.180 155);
  --red:    oklch(58% 0.200 22);
  --ease:   cubic-bezier(0.16,1,0.3,1);
  --easein: cubic-bezier(0.4,0,1,1);
}

/* ── BASE ────────────────────────────────────── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box }
html { height:100%; -webkit-text-size-adjust:100% }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100%;
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* subtle grid texture */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(oklch(100% 0 0 / 2%) 1px, transparent 1px),
    linear-gradient(90deg, oklch(100% 0 0 / 2%) 1px, transparent 1px);
  background-size: 64px 64px;
}

/* ── PROGRESS BAR (top) ──────────────────────── */
#progress-bar {
  position: fixed; top: 0; left: 0; z-index: 100;
  width: 100%; height: 3px;
  background: var(--bg3);
}
#progress-fill {
  height: 100%;
  background: var(--gold);
  width: 0%;
  transition: width 0.5s var(--ease);
}

/* ── HEADER ──────────────────────────────────── */
header {
  position: fixed; top: 3px; left: 0; right: 0; z-index: 90;
  height: 52px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px;
  background: oklch(8% 0.020 250 / 90%);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid oklch(100% 0 0 / 5%);
}
.logo {
  display: flex; align-items: center; gap: 9px;
  text-decoration: none;
}
.logo-mark {
  width: 30px; height: 30px; border-radius: 8px;
  background: var(--gold);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 900; color: var(--bg);
  flex-shrink: 0;
}
.logo-name {
  font-size: 13px; font-weight: 700; color: var(--text);
  line-height: 1;
}
.logo-tag {
  font-size: 10px; color: var(--muted); font-weight: 400;
}
.hdr-step {
  font-size: 11px; font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.04em;
}
.hdr-step span { color: var(--gold) }

/* ── MAIN CANVAS ─────────────────────────────── */
main {
  position: relative; z-index: 1;
  min-height: 100dvh;
  padding-top: 55px;
  display: flex; flex-direction: column;
}

/* ── SCREENS ─────────────────────────────────── */
.screen {
  display: none;
  flex: 1;
  flex-direction: column;
}
.screen.active {
  display: flex;
  animation: screenIn 0.4s var(--ease) both;
}
.screen.exit {
  animation: screenOut 0.25s var(--easein) both;
}
@keyframes screenIn {
  from { opacity: 0; transform: translateY(36px) }
  to   { opacity: 1; transform: translateY(0) }
}
@keyframes screenOut {
  from { opacity: 1; transform: translateY(0) }
  to   { opacity: 0; transform: translateY(-18px) }
}

/* ── WELCOME SCREEN ──────────────────────────── */
.welcome {
  flex: 1;
  display: flex; flex-direction: column;
  justify-content: center;
  padding: 28px 22px 110px;
  max-width: 480px; margin: 0 auto; width: 100%;
}
.welcome-flag {
  font-size: 52px; margin-bottom: 24px;
  animation: flagBounce 0.6s var(--ease) 0.2s both;
}
@keyframes flagBounce {
  from { transform: scale(0.5) rotate(-10deg); opacity: 0 }
  to   { transform: scale(1) rotate(0deg); opacity: 1 }
}
.welcome-brand {
  font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--gold);
  margin-bottom: 12px;
}
.welcome-h1 {
  font-size: clamp(22px, 5vw, 32px);
  font-weight: 800; line-height: 1.2;
  color: var(--text);
  margin-bottom: 14px;
}
.welcome-sub {
  font-size: 14px; color: var(--muted); line-height: 1.65;
  margin-bottom: 28px; max-width: 44ch;
}
.welcome-pills {
  display: flex; flex-direction: column; gap: 10px;
  margin-bottom: 36px;
}
.pill {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg2);
  border: 1px solid oklch(100% 0 0 / 6%);
  border-radius: 12px; padding: 13px 16px;
}
.pill-ico { font-size: 20px; flex-shrink: 0 }
.pill-text { font-size: 13px; color: var(--muted); line-height: 1.4 }
.pill-text strong { color: var(--text); font-weight: 600 }
.welcome-cta {
  width: 100%;
  background: var(--gold); color: var(--bg);
  border: none; border-radius: 14px;
  font-family: inherit; font-size: 16px; font-weight: 800;
  padding: 17px 24px;
  cursor: pointer;
  transition: transform 0.2s var(--ease), box-shadow 0.2s;
  box-shadow: 0 4px 24px oklch(72% 0.16 85 / 30%);
}
.welcome-cta:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 32px oklch(72% 0.16 85 / 40%);
}
.welcome-cta:active { transform: translateY(0) }
.welcome-note {
  text-align: center; margin-top: 16px;
  font-size: 11px; color: var(--dim);
}

/* ── QUESTION SCREEN ─────────────────────────── */
.q-screen {
  flex: 1;
  display: flex; flex-direction: column;
  padding: 24px 22px 110px;
  max-width: 520px; margin: 0 auto; width: 100%;
}
.q-num {
  font-size: 11px; font-weight: 700; color: var(--gold);
  letter-spacing: 0.08em; text-transform: uppercase;
  margin-bottom: 20px; display: flex; align-items: center; gap: 8px;
}
.q-num::before {
  content: '';
  display: inline-block; width: 20px; height: 2px;
  background: var(--gold); border-radius: 1px;
}
.q-text {
  font-size: clamp(18px, 4vw, 26px);
  font-weight: 700; line-height: 1.25;
  color: var(--text);
  margin-bottom: 7px;
}
.q-hint {
  font-size: 13px; color: var(--muted);
  line-height: 1.6; margin-bottom: 24px;
  max-width: 48ch;
}
.q-body { flex: 1 }

/* ── OPTION BUTTONS ──────────────────────────── */
.opts { display: flex; flex-direction: column; gap: 10px }
.opt {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 18px;
  background: var(--bg2);
  border: 1.5px solid oklch(100% 0 0 / 8%);
  border-radius: 12px;
  cursor: pointer;
  transition: border-color 0.18s, background 0.18s, transform 0.15s var(--ease);
  text-align: left; width: 100%;
  font-family: inherit;
}
.opt:hover {
  border-color: var(--goldbdr);
  background: var(--golddim);
  transform: translateX(3px);
}
.opt.selected {
  border-color: var(--gold);
  background: var(--golddim);
}
.opt-letter {
  width: 28px; height: 28px; border-radius: 7px; flex-shrink: 0;
  background: var(--bg3); border: 1px solid var(--dim);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: var(--muted);
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.opt.selected .opt-letter {
  background: var(--gold); border-color: var(--gold); color: var(--bg);
}
.opt-label { font-size: 14px; font-weight: 500; color: var(--text) }
.opt.selected .opt-label { font-weight: 600 }

/* ── COUNT SELECTOR ──────────────────────────── */
.count-wrap { display: flex; gap: 10px; flex-wrap: wrap }
.count-opt {
  width: 60px; height: 60px; border-radius: 12px;
  background: var(--bg2); border: 1.5px solid oklch(100% 0 0 / 8%);
  font-family: inherit; font-size: 22px; font-weight: 700; color: var(--muted);
  cursor: pointer;
  transition: all 0.18s var(--ease);
  display: flex; align-items: center; justify-content: center;
}
.count-opt:hover { border-color: var(--goldbdr); color: var(--text) }
.count-opt.selected {
  background: var(--gold); border-color: var(--gold);
  color: var(--bg); transform: scale(1.06);
}

/* ── TEXT INPUT ──────────────────────────────── */
.q-input-wrap { position: relative }
.q-input {
  width: 100%; padding: 14px 0 10px;
  background: transparent;
  border: none; border-bottom: 2px solid var(--bg3);
  color: var(--text);
  font-family: inherit; font-size: clamp(15px, 3.5vw, 18px);
  font-weight: 500; outline: none;
  transition: border-color 0.2s;
  -webkit-appearance: none;
}
.q-input::placeholder { color: var(--dim) }
.q-input:focus { border-bottom-color: var(--gold) }
.q-input-line {
  position: absolute; bottom: 0; left: 0;
  height: 2px; width: 0%;
  background: var(--gold);
  transition: width 0.3s var(--ease);
  pointer-events: none;
}
.q-input:focus ~ .q-input-line { width: 100% }

/* DATE ──────────────────────────────────────── */
.q-date {
  width: 100%; padding: 14px 0 10px;
  background: transparent;
  border: none; border-bottom: 2px solid var(--bg3);
  color: var(--text);
  font-family: inherit; font-size: clamp(15px, 3.5vw, 17px);
  font-weight: 500; outline: none;
  -webkit-appearance: none; appearance: none;
  transition: border-color 0.2s;
}
.q-date:focus { border-bottom-color: var(--gold) }
.q-date::-webkit-calendar-picker-indicator { filter: invert(0.7) }

/* PHONE / EMAIL ─────────────────────────────── */
.q-tel { font-size: clamp(18px, 4.5vw, 28px) }

/* TEXTAREA ──────────────────────────────────── */
.q-textarea {
  width: 100%; padding: 0;
  background: transparent; border: none;
  border-bottom: 2px solid var(--bg3);
  color: var(--text); font-family: inherit;
  font-size: 14px; font-weight: 500;
  outline: none; resize: none; min-height: 80px; line-height: 1.6;
  transition: border-color 0.2s;
}
.q-textarea:focus { border-bottom-color: var(--gold) }
.q-textarea::placeholder { color: var(--dim) }

/* TRAVELERS LIST ────────────────────────────── */
.traveler-cards { display: flex; flex-direction: column; gap: 12px }
.traveler-card {
  background: var(--bg2); border: 1px solid oklch(100% 0 0 / 6%);
  border-radius: 12px; padding: 16px;
}
.traveler-card-header {
  font-size: 11px; font-weight: 700; color: var(--gold);
  text-transform: uppercase; letter-spacing: 0.07em;
  margin-bottom: 12px;
}
.tc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
@media(max-width:480px){ .tc-grid{ grid-template-columns: 1fr } }
.tc-field { display: flex; flex-direction: column; gap: 5px }
.tc-label {
  font-size: 10px; font-weight: 600; color: var(--dim);
  text-transform: uppercase; letter-spacing: 0.07em;
}
.tc-input {
  background: transparent; border: none;
  border-bottom: 1.5px solid var(--bg3);
  color: var(--text); font-family: inherit;
  font-size: 14px; font-weight: 500; padding: 6px 0;
  outline: none; transition: border-color 0.2s;
  -webkit-appearance: none;
}
.tc-input:focus { border-bottom-color: var(--gold) }
.tc-input::placeholder { color: var(--dim) }
.tc-select {
  background: var(--bg3); border: 1px solid oklch(100% 0 0 / 10%);
  border-radius: 7px; color: var(--text); font-family: inherit;
  font-size: 13px; padding: 7px 10px; outline: none;
  -webkit-appearance: none; width: 100%;
}
.tc-select option { background: var(--bg2) }

/* INFO NOTE ─────────────────────────────────── */
.q-note {
  display: flex; gap: 10px; align-items: flex-start;
  background: var(--golddim); border: 1px solid var(--goldbdr);
  border-radius: 10px; padding: 12px 14px;
  font-size: 12px; color: var(--muted); line-height: 1.55;
  margin-top: 16px;
}
.q-note .ni { font-size: 16px; flex-shrink: 0 }

/* DENIAL NOTE ───────────────────────────────── */
.denial-note {
  background: oklch(58% 0.20 22 / 8%);
  border: 1px solid oklch(58% 0.20 22 / 25%);
  border-radius: 10px; padding: 12px 14px;
  font-size: 12.5px; color: var(--muted); line-height: 1.6;
  margin-bottom: 16px;
}
.denial-note strong { color: var(--text) }

/* SELECT STYLED ─────────────────────────────── */
.q-select {
  width: 100%;
  background: var(--bg2);
  border: 1.5px solid oklch(100% 0 0 / 8%);
  border-radius: 12px; color: var(--text);
  font-family: inherit; font-size: 15px; font-weight: 500;
  padding: 14px 16px; outline: none;
  -webkit-appearance: none; appearance: none;
  transition: border-color 0.2s;
  cursor: pointer;
}
.q-select:focus { border-color: var(--gold) }
.q-select option { background: var(--bg2) }

/* ── NAV (fixed bottom) ──────────────────────── */
.nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 90;
  padding: 12px 20px max(12px, env(safe-area-inset-bottom));
  background: oklch(8% 0.020 250 / 95%);
  backdrop-filter: blur(16px);
  border-top: 1px solid oklch(100% 0 0 / 5%);
  display: flex; gap: 10px; align-items: center;
}
.nav-back {
  width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0;
  background: var(--bg2); border: 1px solid oklch(100% 0 0 / 8%);
  color: var(--muted); font-family: inherit; font-size: 18px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, color 0.15s;
}
.nav-back:hover { background: var(--bg3); color: var(--text) }
.nav-next {
  flex: 1; height: 48px; border-radius: 12px;
  background: var(--gold); border: none; color: var(--bg);
  font-family: inherit; font-size: 15px; font-weight: 800;
  cursor: pointer; letter-spacing: 0.02em;
  transition: transform 0.2s var(--ease), box-shadow 0.2s, opacity 0.2s;
  box-shadow: 0 4px 20px oklch(72% 0.16 85 / 28%);
}
.nav-next:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 28px oklch(72% 0.16 85 / 38%);
}
.nav-next:active { transform: translateY(0) }
.nav-next:disabled {
  opacity: 0.35; cursor: not-allowed;
  transform: none; box-shadow: none;
}
.nav-skip {
  font-size: 12px; color: var(--dim); cursor: pointer;
  background: none; border: none; font-family: inherit;
  padding: 0 4px; flex-shrink: 0;
  transition: color 0.15s;
}
.nav-skip:hover { color: var(--muted) }

/* ── FINAL SCREEN ────────────────────────────── */
.final {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 24px 120px;
  text-align: center; max-width: 520px; margin: 0 auto; width: 100%;
}
.final-check {
  width: 72px; height: 72px; border-radius: 50%;
  background: oklch(64% 0.18 155 / 15%);
  border: 2px solid var(--grn);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; margin: 0 auto 28px;
  animation: checkPop 0.5s var(--ease) both;
}
@keyframes checkPop {
  from { transform: scale(0); opacity: 0 }
  to   { transform: scale(1); opacity: 1 }
}
.final-h { font-size: clamp(24px, 6vw, 36px); font-weight: 900; margin-bottom: 12px }
.final-sub { font-size: 15px; color: var(--muted); line-height: 1.65; margin-bottom: 32px }
.final-box {
  width: 100%;
  background: var(--bg2); border: 1px solid oklch(100% 0 0 / 7%);
  border-radius: 16px; padding: 20px;
  margin-bottom: 24px; text-align: left;
}
.final-box-title {
  font-size: 10px; font-weight: 700; color: var(--gold);
  text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 14px;
}
.final-item {
  display: flex; gap: 11px; padding: 9px 0;
  border-bottom: 1px solid oklch(100% 0 0 / 5%);
  font-size: 13px; line-height: 1.5; color: var(--muted);
}
.final-item:last-child { border: none; padding-bottom: 0 }
.final-item .fi { color: var(--grn); flex-shrink: 0; font-size: 15px }
.final-price {
  font-size: 13px; color: var(--dim); margin-bottom: 24px;
  padding: 12px 16px; background: var(--bg2);
  border-radius: 10px; line-height: 1.6; text-align: left; width: 100%;
}
.final-price strong { color: var(--text) }
.btn-wa {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 16px;
  background: #25D366; color: #fff; border: none; border-radius: 14px;
  font-family: inherit; font-size: 16px; font-weight: 800;
  text-decoration: none; cursor: pointer;
  transition: transform 0.2s var(--ease), box-shadow 0.2s;
  box-shadow: 0 4px 20px oklch(64% 0.18 155 / 30%);
  margin-bottom: 10px;
}
.btn-wa:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 28px oklch(64% 0.18 155 / 40%);
}
.btn-copy {
  width: 100%; padding: 13px;
  background: var(--bg2); border: 1px solid oklch(100% 0 0 / 8%);
  border-radius: 12px; color: var(--muted);
  font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.btn-copy:hover { background: var(--bg3); color: var(--text) }

/* ── KEYBOARD HINT ───────────────────────────── */
.kbd-hint {
  font-size: 11px; color: var(--dim); margin-top: 20px;
  display: flex; align-items: center; gap: 6px;
}
.kbd {
  display: inline-flex; align-items: center; gap: 3px;
  background: var(--bg3); border: 1px solid var(--dim);
  border-radius: 4px; padding: 2px 6px;
  font-size: 10px; color: var(--muted); font-family: monospace;
}

/* ── MOBILE ──────────────────────────────────── */
@media(max-width:480px) {
  .q-screen { padding: 20px 18px 100px }
  .welcome  { padding: 24px 18px 110px }
  .q-text   { font-size: clamp(20px, 5.5vw, 28px) }
  .opt      { padding: 14px 14px }
  .opt-label{ font-size: 14px }
  .count-opt{ width: 52px; height: 52px; font-size: 19px }
  .nav      { padding: 10px 16px max(10px, env(safe-area-inset-bottom)) }
  .nav-back { width: 44px; height: 44px }
  .nav-next { height: 44px; font-size: 14px }
}
@media(max-width:360px) {
  .q-text  { font-size: 19px }
  .welcome-h1 { font-size: 24px }
  .count-opt  { width: 46px; height: 46px; font-size: 17px; border-radius: 10px }
}
</style>
</head>
<body>

<div id="progress-bar"><div id="progress-fill"></div></div>

<header>
  <a class="logo" href="https://www.asesoriadevisadosglobal.com">
    <div class="logo-mark">AV</div>
    <div>
      <div class="logo-name">Asesoría Visa Global</div>
      <div class="logo-tag">asesoriadevisadosglobal.com</div>
    </div>
  </a>
  <div class="hdr-step" id="hdr-step"></div>
</header>

<main id="main"></main>

<div class="nav" id="nav" style="display:none">
  <button class="nav-back" id="btn-back" onclick="prev()" title="Volver">←</button>
  <button class="nav-next" id="btn-next" onclick="next()">Continuar</button>
</div>

<script>
// ── DATA STORE ──────────────────────────────────────────────
const S = {};

// ── QUESTIONS ───────────────────────────────────────────────
// Each question: { id, type, q, hint?, opts?, skip?, condition? }
// Types: welcome | count | opts | text | tel | email | date | select | textarea | travelers | final

const QS = [
  { id:'welcome', type:'welcome' },

  {
    id:'num_viajeros', type:'count', max:6,
    q:'¿Cuántas personas van a viajar?',
    hint:'Cuenta a todos — adultos y niños. Cada persona tiene su propia solicitud.',
    note:'Nosotros preparamos los documentos de cada uno.'
  },

  {
    id:'viajeros_datos', type:'travelers',
    q:'¿Cuáles son los nombres de los viajeros?',
    hint:'Tal como aparecen en el pasaporte. Puedes completar el resto más adelante.',
  },

  {
    id:'visa_anterior', type:'opts',
    q:'¿Alguno ha solicitado visa americana antes?',
    hint:'Aprobada, rechazada o en proceso — cualquier intento cuenta.',
    opts:['Sí, alguno solicitó antes','No, es la primera vez para todos']
  },

  {
    id:'resultado_anterior', type:'opts',
    condition: () => S.visa_anterior === 0,
    q:'¿Cuál fue el resultado?',
    hint:'Sé honesto — la embajada tiene ese historial y Roberto necesita saberlo para prepararte bien.',
    opts:['Fue aprobada (tiene o tuvo visa)','Fue rechazada / negada','Algunos aprobados, otros rechazados'],

// filter by condition
function visibleQs() {
  return QS.filter(q => !q.condition || q.condition());
}

let cursor = 0;

// ── RENDER ───────────────────────────────────────────────────
function render(dir = 1) {
  const qs = visibleQs();
  const q  = qs[cursor];
  const main = document.getElementById('main');
  const nav  = document.getElementById('nav');

  // update progress
  const pct = Math.round((cursor / (qs.length - 1)) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';

  // header step
  const hdr = document.getElementById('hdr-step');
  if (q.type === 'welcome' || q.type === 'final') {
    hdr.innerHTML = '';
  } else {
    const idx = qs.filter((x,i) => i <= cursor && x.type !== 'welcome' && x.type !== 'final').length;
    const total = qs.filter(x => x.type !== 'welcome' && x.type !== 'final').length;
    hdr.innerHTML = `<span>${idx}</span> / ${total}`;
  }

  // exit old screen
  const old = main.querySelector('.screen.active');
  if (old) {
    old.classList.remove('active');
    old.classList.add('exit');
    setTimeout(() => old.remove(), 260);
  }

  // build new screen
  const el = buildScreen(q, qs);
  el.classList.add('screen');
  main.appendChild(el);
  requestAnimationFrame(() => el.classList.add('active'));

  // nav visibility
  const isWelcome = q.type === 'welcome';
  const isFinal   = q.type === 'final';
  nav.style.display = (isWelcome || isFinal) ? 'none' : 'flex';

  if (!isWelcome && !isFinal) {
    const btn = document.getElementById('btn-next');
    btn.textContent = cursor === qs.length - 2 ? '¡Listo!' : 'Continuar';
    btn.disabled = false;
    document.getElementById('btn-back').style.visibility = cursor > 1 ? 'visible' : 'hidden';
  }

  // auto focus input
  setTimeout(() => {
    const inp = el.querySelector('.q-input,.q-tel,.q-date,.q-textarea,.tc-input');
    if (inp) inp.focus();
  }, 420);
}

// ── BUILD SCREENS ────────────────────────────────────────────
function buildScreen(q, qs) {
  const el = document.createElement('div');

  if (q.type === 'welcome') return buildWelcome(el);
  if (q.type === 'final')   return buildFinal(el, qs);

  el.classList.add('q-screen');

  const idx = qs.filter((x,i) => i <= cursor && x.type !== 'welcome' && x.type !== 'final').length;
  el.innerHTML = `
    <div class="q-num">Pregunta ${idx}</div>
    <div class="q-text">${q.q}</div>
    ${q.hint ? `<div class="q-hint">${q.hint}</div>` : ''}
    <div class="q-body" id="qbody"></div>
    ${q.note ? `<div class="q-note"><span class="ni">💡</span><span>${q.note}</span></div>` : ''}
    ${window.innerWidth > 700 ? `<div class="kbd-hint">Presiona <span class="kbd">Enter ↵</span> para continuar</div>` : ''}
  `;

  const body = el.querySelector('#qbody');

  if (q.isDenial) {
    body.insertAdjacentHTML('beforebegin', `<div class="denial-note">
      <strong>Un rechazo no cierra la puerta.</strong> Roberto tiene experiencia con casos negados — lo importante es saber qué pasó para construir una estrategia diferente esta vez.
    </div>`);
  }

  switch(q.type) {
    case 'opts':    buildOpts(body, q);      break;
    case 'count':   buildCount(body, q);     break;
    case 'text':    buildText(body, q);      break;
    case 'tel':     buildTel(body, q);       break;
    case 'email':   buildEmail(body, q);     break;
    case 'date':    buildDate(body, q);      break;
    case 'select':  buildSelect(body, q);    break;
    case 'textarea':buildTextarea(body, q);  break;
    case 'travelers':buildTravelers(body, q); break;
  }

  return el;
}

function buildOpts(body, q) {
  const letters = 'ABCDEFGHIJ';
  const div = document.createElement('div');
  div.className = 'opts';
  q.opts.forEach((o, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt' + (S[q.id] === i ? ' selected' : '');
    btn.innerHTML = `<span class="opt-letter">${letters[i]}</span><span class="opt-label">${o}</span>`;
    btn.onclick = () => {
      S[q.id] = i;
      div.querySelectorAll('.opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      save();
      setTimeout(() => next(), 280);
    };
    div.appendChild(btn);
  });
  body.appendChild(div);
}

function buildCount(body, q) {
  const div = document.createElement('div');
  div.className = 'count-wrap';
  const max = q.max || 6;
  for (let i = 1; i <= max; i++) {
    const btn = document.createElement('button');
    btn.className = 'count-opt' + (S[q.id] === i ? ' selected' : '');
    btn.textContent = i === max ? max + '+' : i;
    btn.onclick = () => {
      S[q.id] = i;
      div.querySelectorAll('.count-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      save();
      setTimeout(() => next(), 280);
    };
    div.appendChild(btn);
  }
  body.appendChild(div);
  if (q.note) {
    const n = document.createElement('div');
    n.className = 'q-note'; n.innerHTML = `<span class="ni">💡</span><span>${q.note}</span>`;
    body.appendChild(n);
  }
}

        ${i > 0 ? `<div class="tc-field">
          <div class="tc-label">Relación con el principal</div>
          <select class="tc-select">

        <div class="tc-field">
          <div class="tc-label">Número de pasaporte</div>
          <input class="tc-input" type="text" placeholder="A0000000" value="${S.viajeros[i].pasaporte || ''}">
        </div>
      </div>
    `;
    const inputs = card.querySelectorAll('.tc-input');
    inputs[0].oninput = e => { S.viajeros[i].nombre = e.target.value; save() };
    inputs[1].oninput = e => { S.viajeros[i].nac = e.target.value; save() };
    if (i > 0) {
      card.querySelector('.tc-select').onchange = e => { S.viajeros[i].rol = parseInt(e.target.value); save() };
      inputs[2].oninput = e => { S.viajeros[i].pasaporte = e.target.value; save() };
    } else {
      if (inputs[2]) inputs[2].oninput = e => { S.viajeros[i].pasaporte = e.target.value; save() };
    }
    wrap.appendChild(card);
  }
  body.appendChild(wrap);
}

// ── NAVIGATION ───────────────────────────────────────────────
function startForm() {
  cursor = 1;
  render();
}

function next() {
  const qs = visibleQs();
  const q  = qs[cursor];

  // validation: skip-able questions can proceed
  const isRequired = !q.skip;
  if (isRequired && !hasValue(q)) {
    shake();
    return;
  }

  if (cursor < qs.length - 1) {
    cursor++;
    render(1);
  }
}

function prev() {
  if (cursor > 1) { cursor--; render(-1) }
}

function hasValue(q) {
  if (!q || q.type === 'welcome' || q.type === 'final' || q.type === 'travelers') return true;
  const v = S[q.id];
  if (q.type === 'opts' || q.type === 'count') return v !== undefined && v !== null;
  if (q.type === 'select') return v !== undefined && v !== null;
  return v !== undefined && String(v).trim() !== '';
}

function shake() {
  const btn = document.getElementById('btn-next');
  if (!btn) return;
  btn.style.transform = 'translateX(-6px)';
  setTimeout(() => btn.style.transform = 'translateX(6px)', 80);
  setTimeout(() => btn.style.transform = '', 160);
}

// ── KEYBOARD ─────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'SELECT') {
    const qs = visibleQs();
    const q  = qs[cursor];
    if (q && q.type !== 'welcome' && q.type !== 'final' && q.type !== 'opts' && q.type !== 'count') {
      next();
    }
  }
});

// ── SKIP BUTTON ───────────────────────────────────────────────
// Inject skip for optional questions
const origRender = render;
function renderWithSkip(dir) {
  origRender(dir);
  setTimeout(() => {
    const qs = visibleQs();
    const q  = qs[cursor];
    const nav = document.getElementById('nav');
    if (q && q.skip && nav) {
      if (!document.getElementById('btn-skip')) {
        const skipBtn = document.createElement('button');
        skipBtn.className = 'nav-skip';
        skipBtn.id = 'btn-skip';
        skipBtn.textContent = 'Saltar';
        skipBtn.onclick = () => { cursor++; render(1) };
        nav.appendChild(skipBtn);
      }
    } else {
      const s = document.getElementById('btn-skip');
      if (s) s.remove();
    }
  }, 100);
}

  try { localStorage.setItem('avg_intake_v2', JSON.stringify({S, cursor})) } catch(e) {}
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem('avg_intake_v2') || '{}');
    if (d.S) Object.assign(S, d.S);
    if (d.cursor && d.cursor > 0) {
      if (confirm('Tienes información guardada. ¿Continuar donde lo dejaste?')) {
        cursor = d.cursor;
      }
    }
  } catch(e) {}
}

// ── INIT ─────────────────────────────────────────────────────
load();
// override render to add skip
window.render = renderWithSkip;
render();
</script>
